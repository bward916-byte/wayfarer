'use strict';
/* ============================================================
   WAYFARER — P1 v7 (spec v3.4)
   v7: hit/death feedback rebuilt (impact spark + squash on hit, the body
       collapses and darkens on death — no white silhouette anywhere), enterable
       buildings with furnished interiors and shopkeepers, Havenbrook rebuilt into
       four quarters with lanes and 14 doors, and palisaded settlements out on
       every branch at depth 2 and 5.
   v6: silhouette hit/death flashes (no more white boxes), a visible impassable
       rim of cliffs and river, four signposted road gates out of the vale, and
       a Depth travel chain of procedural wilderness regions on four branches.
   v2: 2x zoom (240x135 logical) · Havenbrook ring per §11.5:
   wall + gates, the Verge (lamps, stone rail), 6-tile moat,
   4 bridges, cleared outer bank, night spectators + eye glints.
   Building variety: thatch/slate/shingle roofs, timber walls,
   chimneys + smoke, night window glow, tavern sign, well,
   market stall, barrels, fences, gardens. Day/night tint.
   ============================================================ */

/* ---------------- canvas / integer scaling ------------------- */
const cv = document.getElementById('cv');
const sc = cv.getContext('2d');
const logical = document.createElement('canvas');
const g = logical.getContext('2d');
let LW=240, LH=135, SCALE=1, OX=0, OY=0, PORTRAIT=false;

let lastW=0,lastH=0;
function resize(){
  /* measure what the canvas actually occupies — CSS pins it to the
     full viewport, so this is ground truth on iOS/Android */
  const r = cv.getBoundingClientRect();
  const w = Math.max(1,r.width), h = Math.max(1,r.height);
  lastW=w; lastH=h;
  PORTRAIT = h > w;
  const dpr = Math.min(window.devicePixelRatio||1, 3);
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  /* integer scale from the short axis (~135 logical px = 2x zoom),
     then expand the logical viewport to cover the whole screen —
     no letterbox, no sprite resampling */
  const shortPx = Math.min(cv.width, cv.height);
  SCALE = Math.max(1, Math.floor(shortPx/135));
  LW = Math.ceil(cv.width/SCALE); LH = Math.ceil(cv.height/SCALE);
  logical.width = LW; logical.height = LH;
  OX = 0; OY = 0;
  sc.imageSmoothingEnabled = false;
  g.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>{ setTimeout(resize,80); setTimeout(resize,400); });
if(window.visualViewport) window.visualViewport.addEventListener('resize', resize);
setInterval(()=>{               // watchdog: iOS chrome show/hide, late layout
  const r=cv.getBoundingClientRect();
  if(Math.abs(r.width-lastW)>1 || Math.abs(r.height-lastH)>1) resize();
},500);
resize();
setTimeout(resize,300); setTimeout(resize,1000);   // iOS settles late on load

/* ---------------- rng ----------------------------------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296}}
let rng = mulberry32(20260815);
const R = (a,b)=>a+rng()*(b-a);
const RI = (a,b)=>Math.floor(R(a,b+1));

/* ---------------- palette -------------------------------------- */
const PAL = {

/* ---------------- procedural atlas ------------------------------ */
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.imageSmoothingEnabled=false;return[c,x]}
const T = {};
(function buildTiles(){
  const arng = mulberry32(7);
  function tile(name, fn){const [c,x]=mkCanvas(16,16);fn(x);T[name]=c;}
  function speck(x, col, n){x.fillStyle=col;
    for(let i=0;i<n;i++)x.fillRect(Math.floor(arng()*16),Math.floor(arng()*16),1,1);}
  tile('grass0',x=>{x.fillStyle=PAL.grassA;x.fillRect(0,0,16,16);
    speck(x,PAL.grassC,6);speck(x,PAL.grassB,5);});
  tile('grass1',x=>{x.fillStyle=PAL.grassB;x.fillRect(0,0,16,16);
    speck(x,PAL.grassA,7);speck(x,PAL.grassC,3);});
  tile('bank',x=>{x.fillStyle=PAL.bank;x.fillRect(0,0,16,16);
    speck(x,PAL.bankB,7);speck(x,'#6a8050',4);});
  tile('road',x=>{x.fillStyle=PAL.road;x.fillRect(0,0,16,16);
    speck(x,PAL.roadEdge,8);speck(x,'#9c8460',4);});
  tile('water',x=>{x.fillStyle=PAL.water;x.fillRect(0,0,16,16);
    speck(x,'#215878',5);});
  tile('plank',x=>{x.fillStyle=PAL.plank;x.fillRect(0,0,16,16);
    x.fillStyle=PAL.plankD;x.fillRect(0,3,16,1);x.fillRect(0,8,16,1);x.fillRect(0,13,16,1);
    x.fillRect(5,0,1,3);x.fillRect(11,4,1,4);x.fillRect(3,9,1,4);});
  tile('floor',x=>{x.fillStyle='#b0a284';x.fillRect(0,0,16,16);
    x.fillStyle='#a5977a';x.fillRect(0,7,16,1);x.fillRect(7,0,1,7);x.fillRect(11,8,1,8);});
  tile('rockg',x=>{x.fillStyle=PAL.rockG;x.fillRect(0,0,16,16);
    speck(x,PAL.rockGD,9);speck(x,PAL.rockGL,5);
    x.fillStyle=PAL.rockGD;x.fillRect(0,6,16,1);x.fillRect(4,11,9,1);});
  tile('gravel',x=>{x.fillStyle=PAL.gravel;x.fillRect(0,0,16,16);
    speck(x,PAL.gravelD,10);speck(x,PAL.rockL,4);});
  tile('cobble',x=>{x.fillStyle='#9a917f';x.fillRect(0,0,16,16);
    x.fillStyle='#877e6d';
    x.fillRect(1,1,6,5);x.fillRect(9,2,6,4);x.fillRect(2,8,5,6);x.fillRect(9,8,6,5);});
})();

/* paper doll (4 dirs x 2 frames) */
function buildDoll(app){
  const frames = {};
  for(const dir of ['down','up','left','right']){
    frames[dir]=[];
    for(let f=0; f<2; f++){
      const [c,x] = mkCanvas(16,20);
      const bob = f?1:0;
      x.fillStyle = app.legs;
      if(dir==='left'||dir==='right'){
        x.fillRect(6+(f?1:-1),15,3,5); x.fillRect(8+(f?-1:1),15,3,5);
      } else {
        x.fillRect(5,15,3,5-(f?1:0)); x.fillRect(9,15,3,5-(f?0:1));
      }
      x.fillStyle = app.tunic; x.fillRect(4,8+bob,8,8);
      x.fillStyle = PAL.belt;  x.fillRect(4,13+bob,8,1);
      x.fillStyle = app.tunic;
      if(dir==='left'){ x.fillRect(3,9+bob,2,5); }
      else if(dir==='right'){ x.fillRect(11,9+bob,2,5); }
      else { x.fillRect(3,9+bob,2,5); x.fillRect(11,9+bob,2,5); }
      x.fillStyle = app.skin;
      if(dir==='left'){ x.fillRect(3,13+bob,2,2); }
      else if(dir==='right'){ x.fillRect(11,13+bob,2,2); }
      else { x.fillRect(3,13+bob,2,2); x.fillRect(11,13+bob,2,2); }
      x.fillStyle = app.skin; x.fillRect(5,2+bob,6,6);
      x.fillStyle = app.hair; x.fillRect(4,1+bob,8,3);
      if(dir==='up'){ x.fillRect(4,1+bob,8,5); }
      else if(dir==='left'){ x.fillRect(9,3+bob,3,3); }
      else if(dir==='right'){ x.fillRect(4,3+bob,3,3); }
      if(dir!=='up'){
        x.fillStyle='#20180f';
        if(dir==='down'){ x.fillRect(6,5+bob,1,1); x.fillRect(9,5+bob,1,1); }
        if(dir==='left'){ x.fillRect(6,5+bob,1,1); }
        if(dir==='right'){ x.fillRect(9,5+bob,1,1); }
      }
      frames[dir].push(c);
    }
  }
  return frames;
}
function buildWolf(){
  const out=[];
  for(let f=0; f<2; f++){
    const [c,x]=mkCanvas(18,12);
    x.fillStyle=PAL.wolfA;
    x.fillRect(3,3,10,5); x.fillRect(12,1,5,4);
    x.fillStyle=PAL.wolfB;
    x.fillRect(0,2,4,2); x.fillRect(15,4,2,2);
    x.fillRect(4+(f?1:0),8,2,4); x.fillRect(10-(f?1:0),8,2,4);
    x.fillStyle=PAL.wolfEye; x.fillRect(14,2,1,1);
    x.fillStyle=PAL.wolfB; x.fillRect(13,0,2,1);
    out.push(c);
  }
  return out;
}

/* silhouette tint cache — a flash tints the SPRITE, never a bounding box */
let _tidN=0;
const _tintCache = new Map();
function tintOf(spr,col){
  if(!spr.__tid) spr.__tid='s'+(++_tidN);
  const k=spr.__tid+'|'+col;
  let c=_tintCache.get(k);
  if(c) return c;
  const [cc,x2]=mkCanvas(spr.width,spr.height);
  x2.drawImage(spr,0,0);
  x2.globalCompositeOperation='source-atop';
  x2.fillStyle=col; x2.fillRect(0,0,spr.width,spr.height);
  _tintCache.set(k,cc);
  return cc;
}

/* ---------------- world geometry (§11.5) ------------------------- */
/*  interior 21..39 x 25..43 · wall ring 20/40, 24/44 · verge +3
    moat +6 · bank +4 · bridges N/S/E/W · roads cross at 30/34    */
const MAXW=112, MAXH=72;
let MW=MAXW, MH=MAXH;
const ground = new Uint8Array(MAXW*MAXH);
const solid  = new Uint8Array(MAXW*MAXH);
const flags  = new Uint8Array(MAXW*MAXH);
/* flag bits: 1=span/bridge  2=safe ground  4=outer bank  8=rim gate  16=verge walk */
const GID = {grass0:0, grass1:1, road:2, water:3, floor:4, plank:5, bank:6, cobble:7,
             rockg:8, gravel:9};
const GT  = ['grass0','grass1','road','water','floor','plank','bank','cobble',
             'rockg','gravel'];
const idx = (tx,ty)=>ty*MW+tx;
const inMap = (tx,ty)=>tx>=0&&ty>=0&&tx<MW&&ty<MH;
const inR = (tx,ty,x0,y0,x1,y1)=>tx>=x0&&tx<=x1&&ty>=y0&&ty<=y1;

const WALL={x0:20,y0:24,x1:40,y1:44};              // wall ring rect
const VERGE={x0:17,y0:21,x1:43,y1:47};             // verge outer rect
const MOAT={x0:11,y0:15,x1:49,y1:53};              // moat outer rect
const BANK={x0:7, y0:11,x1:53,y1:57};              // bank outer rect
const RX=30, RY=34;                                 // road cross (center col/row)
const TOWN_CX=(RX)*16+8, TOWN_CY=(RY)*16+8;

/* ---- map rim & travel: the world has edges you can SEE, and roads out ---- */
const BORDER=3;            // thickness of the impassable rim, in tiles
const GATE_HALF=1;         // road corridor through the rim = 3 tiles wide
const BRANCHES={
  N:{key:'N',label:'FROST PASS',tint:'#8fb6d8',
     names:['Windward Steps','Hoarfrost Climb','The White Teeth','Sovereign\u2019s Gate']},
  E:{key:'E',label:'THORNWOOD',tint:'#6f9a58',
     names:['Thornwood Verge','Deep Thorn','The Snarl','Blackbriar Hollow']},
  S:{key:'S',label:'FENMARCH',tint:'#7f9a86',
     names:['Fen Road','Drowned Acres','The Sinking Mile','Mirefast']},
  W:{key:'W',label:'OLD QUARRY',tint:'#b09878',
     names:['Quarry Road','Cutstone Rows','The Deep Cut','Underdark Shelf']}
};
const OPP={N:'S',S:'N',E:'W',W:'E'};
const DIRWORD={N:'NORTH',S:'SOUTH',E:'EAST',W:'WEST'};

const inVergeT = (tx,ty)=> inR(tx,ty,VERGE.x0,VERGE.y0,VERGE.x1,VERGE.y1);
const inMoatT  = (tx,ty)=> inR(tx,ty,MOAT.x0,MOAT.y0,MOAT.x1,MOAT.y1) && !inVergeT(tx,ty);
const inBankT  = (tx,ty)=> inR(tx,ty,BANK.x0,BANK.y0,BANK.x1,BANK.y1) &&
                           !inR(tx,ty,MOAT.x0,MOAT.y0,MOAT.x1,MOAT.y1);
function inTown(px,py){          // safe ground: any settlement, its bridges, interiors
  if(region.interior) return true;
  const tx=Math.floor(px/16), ty=Math.floor(py/16);
  if(!inMap(tx,ty)) return false;
  return (flags[idx(tx,ty)]&2)!==0;
}
function onVerge(px,py){
  const tx=Math.floor(px/16), ty=Math.floor(py/16);
  return inMap(tx,ty) && (flags[idx(tx,ty)]&16)!==0;
}

const buildings=[], trees=[], lamps=[], props=[], wallTiles=[], glints=[], decor=[];
const cliffs=[], rocks=[], npcs=[], doors=[];
let exits=[];
let interiorSave=null;
let region={branch:null, depth:0, name:'Havenbrook Vale', interior:false, settlement:true};
let renown=0;
let banner=null;                 // {name,sub,t}
let fade=null;                   // {t,phase,to}

function clearWorld(w,h){
  MW = w||MAXW; MH = h||MAXH;
  ground.fill(GID.grass0); solid.fill(0); flags.fill(0);
  buildings.length=0; trees.length=0; lamps.length=0; props.length=0;
  wallTiles.length=0; glints.length=0; decor.length=0;
  cliffs.length=0; rocks.length=0; npcs.length=0; doors.length=0;
  exits=[];
}
function addProp(type,tx,ty,solidTile,extra){
  const p={type,x:tx*16+8,y:ty*16+16,tx,ty,seed:RI(0,99)};
  if(extra)for(const k in extra)p[k]=extra[k];
  props.push(p);
  if(solidTile) solid[idx(tx,ty)]=1;
  return p;
}

/* ---- the rim: rock escarpment (and water where asked) around the map ---- */
function gateCells(d){
  const out=[];
  if(d==='N'||d==='S'){
    const a=d==='N'?0:MH-BORDER, b=d==='N'?BORDER-1:MH-1;
    for(let ty=a;ty<=b;ty++)for(let o=-GATE_HALF;o<=GATE_HALF;o++)out.push([RX+o,ty]);
  }else{
    const a=d==='W'?0:MW-BORDER, b=d==='W'?BORDER-1:MW-1;
    for(let tx=a;tx<=b;tx++)for(let o=-GATE_HALF;o<=GATE_HALF;o++)out.push([tx,RY+o]);
  }
  return out;
}
function sideOf(tx,ty){
  if(ty<BORDER)return 'N';
  if(ty>=MH-BORDER)return 'S';
  if(tx<BORDER)return 'W';
  if(tx>=MW-BORDER)return 'E';
  return null;
}
function buildRim(waterSides, gateDirs, rrng){
  const wet=d=>waterSides.indexOf(d)>=0;
  for(let ty=0;ty<MH;ty++)for(let tx=0;tx<MW;tx++){
    const side=sideOf(tx,ty); if(!side)continue;
    const i=idx(tx,ty);
    ground[i]= wet(side)?GID.water:GID.rockg;
    solid[i]=1;
  }
  for(const d of gateDirs){
    const wetD=wet(d);
    for(const c of gateCells(d)){
      const i=idx(c[0],c[1]);
      ground[i]= wetD?GID.plank:GID.road; solid[i]=0; flags[i]|=8;
    }
  }
  /* cliff faces: rim tiles whose inward neighbour is walkable get a raised face */
  for(let ty=0;ty<MH;ty++)for(let tx=0;tx<MW;tx++){
    const side=sideOf(tx,ty); if(!side)continue;
    if(!solid[idx(tx,ty)])continue;
    if(ground[idx(tx,ty)]===GID.water)continue;
    const dx = side==='W'?1:side==='E'?-1:0;
    const dy = side==='N'?1:side==='S'?-1:0;
    const nx=tx+dx, ny=ty+dy;
    if(!inMap(nx,ny)||solid[idx(nx,ny)])continue;
    cliffs.push({tx,ty,side,seed:RI(0,255)});
  }
  /* boulders scattered along the inner lip, plus a few just inside */
  for(let i=0;i<70;i++){
    const e=RI(0,3);
    let tx,ty;
    if(e===0){tx=RI(BORDER,MW-BORDER-1);ty=RI(BORDER,BORDER+2);}
    else if(e===1){tx=RI(BORDER,MW-BORDER-1);ty=RI(MH-BORDER-3,MH-BORDER-1);}
    else if(e===2){tx=RI(BORDER,BORDER+2);ty=RI(BORDER,MH-BORDER-1);}
    else {tx=RI(MW-BORDER-3,MW-BORDER-1);ty=RI(BORDER,MH-BORDER-1);}
    if(!inMap(tx,ty))continue;
    const i2=idx(tx,ty);
    if(solid[i2]||ground[i2]===GID.water||ground[i2]===GID.road||ground[i2]===GID.plank)continue;
    if(Math.abs(tx-RX)<3||Math.abs(ty-RY)<3)continue;
    rocks.push({x:tx*16+8,y:ty*16+15,seed:RI(0,255),big:rng()<0.4});
    solid[i2]=1;
  }
}
/* gate dressing: two stone pillars + a signpost at the inner mouth */
function dressGate(d, label, sub){
  let px,py,ax,ay,bx,by;
  if(d==='N'||d==='S'){
    const ty = d==='N'?BORDER:MH-BORDER-1;
    ax=RX-2; ay=ty; bx=RX+2; by=ty;
    px=RX+3; py=(d==='N'?ty+1:ty-1);
  }else{
    const tx = d==='W'?BORDER:MW-BORDER-1;
    ax=tx; ay=RY-2; bx=tx; by=RY+2;
    px=(d==='W'?tx+1:tx-1); py=RY+3;
  }
  if(inMap(ax,ay))addProp('gatepost',ax,ay,true,{side:d});
  if(inMap(bx,by))addProp('gatepost',bx,by,true,{side:d});
  if(inMap(px,py))addProp('sign',px,py,true,{label:label,sub:sub,dir:d});
}
function addExit(d,to){
  let x0,y0,x1,y1;
  if(d==='N'){x0=RX-GATE_HALF;y0=0;x1=RX+GATE_HALF;y1=1;}
  else if(d==='S'){x0=RX-GATE_HALF;y0=MH-2;x1=RX+GATE_HALF;y1=MH-1;}
  else if(d==='W'){x0=0;y0=RY-GATE_HALF;x1=1;y1=RY+GATE_HALF;}
  else {x0=MW-2;y0=RY-GATE_HALF;x1=MW-1;y1=RY+GATE_HALF;}
  exits.push({px0:x0*16,py0:y0*16,px1:(x1+1)*16,py1:(y1+1)*16,dir:d,to:to});
}
const BKINDS={
  tavern:{floor:'floor', label:'Tavern'},
  smithy:{floor:'cobble',label:'Forge'},
  store: {floor:'floor', label:'Goods'},
  chapel:{floor:'cobble',label:'Chapel'},
  home:  {floor:'floor', label:'Home'},
  stable:{floor:'gravel',label:'Stable'},
  guard: {floor:'cobble',label:'Watchhouse'}
};
let doorLock=0;

function addDoor(b){
  const dt=b.door, dy=b.ty+b.th;              // the tile the doorstep opens onto
  if(!inMap(dt,dy)) return;
  solid[idx(dt,dy)]=0;
  doors.push({tx:dt, ty:dy, b:b});
}
function enterBuilding(b){
  interiorSave={branch:region.branch, depth:region.depth, name:region.name,
                settlement:region.settlement, x:player.x, y:player.y};
  genInterior(b);
  const p=doors[0];
  player.x=(p?p.tx:Math.floor(MW/2))*16+8; player.y=(MH-3)*16+8;
  camX=MW*16<=LW?(MW*16-LW)/2:Math.max(0,Math.min(player.x-LW/2,MW*16-LW));
  camY=MH*16<=LH?(MH*16-LH)/2:Math.max(0,Math.min(player.y-LH/2,MH*16-LH));
  doorLock=0.6;
  wolves.length=0; projectiles.length=0; particles.length=0; sparks.length=0;
  novas.length=0; spectators.length=0; animals.length=0; ripples.length=0;
  flocks.length=0; frostPatches.length=0; _anchors=null;
  banner={name:b.name||BKINDS[b.kind].label, sub:'INSIDE', t:2.6};
  beep(400,0.06,0.035,'sine');
}
function leaveBuilding(){
  const sv=interiorSave; interiorSave=null;
  if(!sv){ return; }
  wolves.length=0; projectiles.length=0; particles.length=0; sparks.length=0;
  novas.length=0; spectators.length=0; animals.length=0; ripples.length=0;
  flocks.length=0; frostPatches.length=0; _anchors=null;
  if(sv.depth<=0) genVale(); else if(isTownDepth(sv.depth)) genTown(sv.branch,sv.depth);
  else genWild(sv.branch,sv.depth);
  player.x=sv.x; player.y=sv.y;
  if(!solidAt(player.x, player.y+18)) player.y+=18;   // step clear of the doorstep
  camX=Math.max(0,Math.min(player.x-LW/2,MW*16-LW));
  camY=Math.max(0,Math.min(player.y-LH/2,MH*16-LH));
  spawnAnimals();
  if(region.depth>0) spawnWildPacks();
  else { spawnWolfPack(66*16,36*16,4); spawnWolfPack(76*16,26*16,3); }
  doorLock=0.8;
  beep(300,0.06,0.035,'sine');
}
function genInterior(b){
  const kind=b.kind||'home';
  const K=BKINDS[kind];
  const w=Math.max(11, Math.min(17, b.tw*2+3)), h=9;
  clearWorld(w,h);
  region={branch:interiorSave.branch, depth:interiorSave.depth,
          name:b.name||K.label, interior:true, settlement:true};
  rng=mulberry32(hashSeed('int:'+kind+':'+(b.name||'')+b.tx, b.ty));
  const F=GID[K.floor];
  for(let ty=0;ty<h;ty++)for(let tx=0;tx<w;tx++){
    const i=idx(tx,ty);
    ground[i]=F; flags[i]|=2;
    if(tx===0||ty===0||tx===w-1||ty===h-1){
      solid[i]=1; wallTiles.push({tx,ty,inner:true,roof:b.roof});
    }
  }
  const cx=Math.floor(w/2);
  /* doorway back out, bottom centre */
  const di=idx(cx,h-1);
  ground[di]=GID.plank; solid[di]=0;
  for(const wt of wallTiles) if(wt.tx===cx&&wt.ty===h-1) wt.gap=true;
  doors.push({tx:cx, ty:h-1, exit:true});

  function P(t,tx,ty,sol,extra){ if(inMap(tx,ty)) addProp(t,tx,ty,sol,extra); }
  const kx=2, ky=2;
  if(kind==='tavern'){
    P('hearth',w-3,1,true);
    for(let i=0;i<2;i++){ P('table',3+i*4,3,true); P('stool',2+i*4,3,false); P('stool',5+i*4,3,false); }
    P('counter',cx-2,1,true); P('counter',cx-1,1,true); P('counter',cx,1,true);
    P('kegs',1,1,true); P('shelf',2,1,true);
    npcs.push(mkNpc(cx-1,2,'Maera','Ale\u2019s warm, the road\u2019s cold. Sit a while.',true));
    npcs.push(mkNpc(4,5,'a drover','Wolves thicker past the second gate. Mind yourself.',false));
  } else if(kind==='smithy'){
    P('forge',w-3,1,true); P('anvil',cx,3,true);
    P('rack',1,1,true); P('barrel',2,1,true); P('crate',w-2,4,true);
    npcs.push(mkNpc(cx,2,'Orrin','Bring me iron and I\u2019ll bring you an edge.',true));
  } else if(kind==='store'){
    for(let tx=2;tx<w-2;tx++) P('counter',tx,3,true);
    for(let tx=1;tx<w-1;tx++) if(tx%2) P('shelf',tx,1,true);
    P('sack',1,5,false); P('sack',2,5,false); P('barrel',w-2,5,true);
    npcs.push(mkNpc(cx,2,'Wick','Rope, salt, lamp oil. Coin first, questions after.',true));
  } else if(kind==='chapel'){
    P('altar',cx,1,true);
    for(let i=0;i<3;i++){ P('pew',cx-2,3+i,true); P('pew',cx+2,3+i,true); }
    P('candles',cx-1,1,false); P('candles',cx+1,1,false);
    npcs.push(mkNpc(cx,2,'Sister Enna','The water holds. The lamps hold. So do we.',true));
  } else if(kind==='stable'){
    for(let tx=1;tx<w-1;tx+=3) P('hay',tx,1,true);
    P('trough',cx,4,true); P('rack',w-2,2,true);
    npcs.push(mkNpc(2,4,'a stablehand','Don\u2019t feed the geese. They remember.',false));
  } else if(kind==='guard'){
    P('rack',1,1,true); P('rack',2,1,true); P('table',cx,3,true);
    P('bed',w-3,1,true);
    npcs.push(mkNpc(cx,2,'Serjeant Balt','Road\u2019s open. Staying open is your problem.',true));
  } else {
    P('bed',1,1,true); P('table',cx+1,3,true); P('stool',cx,3,false);
    P('hearth',w-3,1,true); P('shelf',2,1,true); P('crate',w-2,5,true);
    npcs.push(mkNpc(cx+1,2,'a villager',
      ['Quiet year. Long may it hold.','My roof leaks when the fen wind turns.',
       'You came in off the road? Brave or fool, then.'][RI(0,2)],false));
  }
  lamps.push({x:cx*16+8, y:2*16+8});
}
function mkNpc(tx,ty,name,line,fixed){
  return {x:tx*16+8, y:ty*16+12, dir:'down', frame:0, animT:0, moving:false,
    spr:NPC_SPR[RI(0,NPC_SPR.length-1)], name:name, line:line, fixed:!!fixed,
    hx:tx*16+8, hy:ty*16+12, wanderT:R(0,3), wa:R(0,6.28), wm:false};
}

function gatePos(d){
  if(d==='N')return {x:RX*16+8, y:(BORDER+1)*16+8};
  if(d==='S')return {x:RX*16+8, y:(MH-BORDER-2)*16+8};
  if(d==='W')return {x:(BORDER+1)*16+8, y:RY*16+8};
  return {x:(MW-BORDER-2)*16+8, y:RY*16+8};
}
function isTownDepth(d){ return d===2 || d===5; }

/* shared: lay a building, register its door, refuse impossible footprints */
function placeBuilding(tx,ty,tw,th,roof,wall,kind,name,opts){
  for(let y=ty;y<ty+th+1;y++)for(let x=tx-1;x<tx+tw+1;x++){
    if(!inMap(x,y)) return null;
    if(y<ty+th && x>=tx && x<tx+tw){
      const gi=idx(x,y);
      if(solid[gi]) return null;
      if(ground[gi]===GID.road||ground[gi]===GID.water||ground[gi]===GID.plank) return null;
    }
  }
  const door=tx+Math.floor(tw/2);
  if(solid[idx(door,ty+th)]) return null;
  for(const dr of doors){                       // never build over someone else's doorstep
    if(dr.tx>=tx&&dr.tx<tx+tw&&dr.ty>=ty&&dr.ty<ty+th) return null;
  }
  const b={tx,ty,tw,th,door,roof,wall,kind:kind||'home',name:name||null,
    chim:opts&&opts.chim, sign:opts&&opts.sign, smokeT:R(0,1)};
  buildings.push(b);
  for(let y=ty;y<ty+th;y++)for(let x=tx;x<tx+tw;x++){
    solid[idx(x,y)]=1; ground[idx(x,y)]=GID.floor;
  }
  addDoor(b);
  return b;
}

function genVale(){
  clearWorld();
  region={branch:null, depth:0, name:'Havenbrook Vale', interior:false, settlement:true};
  rng = mulberry32(20260815);
  const wr = mulberry32(99);

  for(let ty=0;ty<MH;ty++)for(let tx=0;tx<MW;tx++)
    ground[idx(tx,ty)] = wr()<0.5?GID.grass0:GID.grass1;

  /* bank ring: cleared ground so the horde is visible */
  for(let ty=BANK.y0;ty<=BANK.y1;ty++)for(let tx=BANK.x0;tx<=BANK.x1;tx++)
    if(inBankT(tx,ty)){ ground[idx(tx,ty)]=GID.bank; flags[idx(tx,ty)]|=4; }
  /* moat */
  for(let ty=MOAT.y0;ty<=MOAT.y1;ty++)for(let tx=MOAT.x0;tx<=MOAT.x1;tx++)
    if(inMoatT(tx,ty)){ ground[idx(tx,ty)]=GID.water; solid[idx(tx,ty)]=1; }
  /* verge: safe + lamp-lit walk */
  for(let ty=VERGE.y0;ty<=VERGE.y1;ty++)for(let tx=VERGE.x0;tx<=VERGE.x1;tx++){
    if(!inVergeT(tx,ty))continue;
    flags[idx(tx,ty)]|=2;
    if(!inR(tx,ty,WALL.x0,WALL.y0,WALL.x1,WALL.y1)) flags[idx(tx,ty)]|=16;
  }
  /* wall ring with gate openings */
  for(let tx=WALL.x0;tx<=WALL.x1;tx++)for(const ty of [WALL.y0,WALL.y1]){
    if(Math.abs(tx-RX)<=1) continue;
    solid[idx(tx,ty)]=1; wallTiles.push({tx,ty});
  }
  for(let ty=WALL.y0+1;ty<WALL.y1;ty++)for(const tx of [WALL.x0,WALL.x1]){
    if(Math.abs(ty-RY)<=1) continue;
    solid[idx(tx,ty)]=1; wallTiles.push({tx,ty});
  }

  /* ---- streets ---- */
  function road(tx,ty){ const i=idx(tx,ty);
    if(ground[i]!==GID.water) ground[i]=GID.road; }
  function path(tx,ty){ if(!inMap(tx,ty))return; const i=idx(tx,ty);
    if(solid[i]||ground[i]===GID.water||ground[i]===GID.road||ground[i]===GID.plank)return;
    ground[i]=GID.gravel; }
  /* the two highroads, gate to gate and out to the rim */
  for(let ty=0;ty<MH;ty++)for(let d=-1;d<=1;d++) road(RX+d,ty);
  for(let tx=0;tx<MW;tx++)for(let d=-1;d<=1;d++) road(tx,RY+d);
  const IX0=WALL.x0+1, IX1=WALL.x1-1, IY0=WALL.y0+1, IY1=WALL.y1-1;

  /* bridges over the moat, safe */
  function bridge(tx,ty){ const i=idx(tx,ty);
    ground[i]=GID.plank; solid[i]=0; flags[i]|=1|2; }
  for(let d=-1;d<=1;d++){
    for(let ty=MOAT.y0;ty<VERGE.y0;ty++) bridge(RX+d,ty);
    for(let ty=VERGE.y1+1;ty<=MOAT.y1;ty++) bridge(RX+d,ty);
    for(let tx=MOAT.x0;tx<VERGE.x0;tx++) bridge(tx,RY+d);
    for(let tx=VERGE.x1+1;tx<=MOAT.x1;tx++) bridge(tx,RY+d);
  }

  /* rim: cliffs three sides, river east, four signposted road mouths */
  buildRim(['E'], ['N','E','S','W'], wr);
  for(const d of ['N','E','S','W']){
    dressGate(d, BRANCHES[d].label, DIRWORD[d]);
    addExit(d, {branch:d, depth:1, entryDir:OPP[d]});
  }

  /* ---- the town: four quarters around the crossroads ---- */
  const BLD=[
    /* north-west quarter */
    [21,25,4,4,'slate','stone','smithy','Emberhold Forge',{chim:1,sign:1}],
    [26,25,3,4,'slate','stone','guard','North Watchhouse',{sign:1}],
    [21,30,4,3,'thatch','timber','store','Wick & Wether',{sign:1}],
    /* north-east quarter */
    [33,25,6,4,'shingle','timber','tavern','The Drowned Lantern',{chim:1,sign:1}],
    [33,30,3,3,'slate','stone','chapel','Chapel of the Still Water',{sign:1}],
    [37,30,3,3,'thatch','timber','home',null,{chim:1}],
    /* south-west quarter */
    [21,36,4,3,'thatch','timber','home',null,{chim:1}],
    [26,36,3,3,'shingle','timber','stable','Longmoor Stables',{sign:1}],
    [21,40,4,3,'thatch','timber','home',null,{chim:1}],
    [26,40,3,3,'thatch','timber','home',null,{}],
    /* south-east quarter */
    [32,36,4,3,'shingle','timber','store','Marrow & Sons',{sign:1}],
    [37,36,3,3,'thatch','timber','home',null,{chim:1}],
    [32,40,4,3,'thatch','timber','home',null,{}],
    [37,40,3,3,'thatch','timber','home',null,{chim:1}]
  ];
  for(const d of BLD) placeBuilding(d[0],d[1],d[2],d[3],d[4],d[5],d[6],d[7],d[8]);

  /* cobbled market square, then a ring walk inside the wall */
  for(let ty=RY-4;ty<=RY+4;ty++)for(let tx=RX-5;tx<=RX+5;tx++){
    if(!inR(tx,ty,IX0,IY0,IX1,IY1))continue;
    const i=idx(tx,ty);
    if(solid[i]||ground[i]===GID.road)continue;
    ground[i]=GID.cobble;
  }
  for(let tx=IX0;tx<=IX1;tx++){ path(tx,IY0); path(tx,IY1); }
  for(let ty=IY0;ty<=IY1;ty++){ path(IX0,ty); path(IX1,ty); }
  /* a beaten track from every doorstep to the nearest highroad */
  function lane(fx,fy){
    let tx=fx, ty=fy;
    if(Math.abs(fx-RX) < Math.abs(fy-RY)){
      while(Math.abs(ty-RY)>1){ ty += ty<RY?1:-1; path(tx,ty); }
      while(Math.abs(tx-RX)>1){ tx += tx<RX?1:-1; path(tx,ty); }
    } else {
      while(Math.abs(tx-RX)>1){ tx += tx<RX?1:-1; path(tx,ty); }
      while(Math.abs(ty-RY)>1){ ty += ty<RY?1:-1; path(tx,ty); }
    }
  }
  for(const dr of doors) if(!dr.exit){ path(dr.tx,dr.ty); lane(dr.tx,dr.ty); }
  /* everything inside the wall is safe ground */
  for(let ty=IY0;ty<=IY1;ty++)for(let tx=IX0;tx<=IX1;tx++) flags[idx(tx,ty)]|=2;

  /* town furniture — only where there's room for it */
  function tryProp(t,tx,ty,sol,extra){
    if(!inMap(tx,ty))return null;
    const i=idx(tx,ty);
    if(solid[i]||ground[i]===GID.water||ground[i]===GID.road)return null;
    return addProp(t,tx,ty,sol,extra);
  }
  tryProp('fountain', 27, 31, true);
  tryProp('stall', 26, 32, true); tryProp('stall', 28, 32, true);
  tryProp('stall', 26, 30, true); tryProp('stall', 28, 30, true);
  tryProp('well', 36, 41, true);
  tryProp('cart', 36, 38, true);
  tryProp('cart', 25, 27, true);
  tryProp('woodpile', 25, 31, true);
  tryProp('woodpile', 36, 32, true);
  tryProp('hay', 25, 41, true); tryProp('hay', 25, 42, true);
  tryProp('trough', 25, 37, true);
  tryProp('barrel', 31, 26, true); tryProp('barrel', 32, 26, true);
  tryProp('crate', 39, 26, true);
  tryProp('bench', 32, 31, false); tryProp('bench', 32, 32, false);
  tryProp('laundry', 25, 38, false); tryProp('laundry', 36, 30, false);
  tryProp('planter', 25, 30, false); tryProp('planter', 36, 42, false);
  for(let tx=21;tx<=24;tx++){ tryProp('fence',tx,43,false); }
  for(let tx=21;tx<=24;tx++){ tryProp('crop',tx,44,false); }
  for(let ty=25;ty<=28;ty++) tryProp('crop',39,ty,false);
  for(const f of [[18,22],[26,22],[36,22],[42,26],[42,36],[18,32],[18,42],
                  [26,46],[36,46],[25,25],[39,43],[25,43]])
    tryProp('flower',f[0],f[1],false);
  /* orchard row along the east ring walk */
  for(let ty=27;ty<=41;ty+=4){
    const tx=IX1;
    if(inMap(tx,ty)&&!solid[idx(tx,ty)]&&ground[idx(tx,ty)]!==GID.road){
      solid[idx(tx,ty)]=1;
      trees.push({x:tx*16+8,y:ty*16+16,seed:RI(0,3),kind:0});
    }
  }

  /* lamps: verge ring, the square, the quarters */
  function lamp(tx,ty){ lamps.push({x:tx*16+8,y:ty*16+8}); }
  for(let tx=18;tx<=42;tx+=8){ lamp(tx,22); lamp(tx,46); }
  for(let ty=28;ty<=44;ty+=8){ lamp(18,ty); lamp(42,ty); }
  lamp(RX-3,RY-2); lamp(RX+3,RY+2); lamp(RX-6,RY-6); lamp(RX+6,RY+6);
  lamp(IX0+1,IY0+1); lamp(IX1-1,IY0+1); lamp(IX0+1,IY1-1); lamp(IX1-1,IY1-1);

  /* townsfolk on the lanes */
  const folk=[
    [27,29,'Hana','Fresh from the beds this morning. Mind the geese.'],
    [32,29,'Tobin','Four roads out. Only one of them is kind.'],
    [23,34,'Old Pell','I walked to the Deep Cut once. Once was plenty.'],
    [37,34,'Ivy','Lamps get lit at dusk. Be inside the wall or on the Verge.'],
    [30,27,'a carter','Hauling to Coldharrow at first light, road willing.'],
    [30,39,'Bertran','My boy watches the moat at night. Says they just stand there.'],
    [25,33,'Nell','Wick will overcharge you. Haggle him down.'],
    [36,39,'a woodcutter','Thornwood timber is the best there is. Getting it out is the trick.'],
    [23,39,'Sim','Stable roof wants rethatching before the fen wind turns.']
  ];
  for(const f of folk){
    if(inMap(f[0],f[1])&&!solid[idx(f[0],f[1])])
      npcs.push(mkNpc(f[0],f[1],f[2],f[3],false));
  }

  /* trees outside the bank ring */
  for(let i=0;i<300;i++){
    const tx=RI(1,MW-2), ty=RI(1,MH-2);
    if(inR(tx,ty,BANK.x0-1,BANK.y0-1,BANK.x1+1,BANK.y1+1))continue;
    const gid=ground[idx(tx,ty)];
    if(gid===GID.road||gid===GID.water||solid[idx(tx,ty)])continue;
    if(Math.abs(ty-RY)<3||Math.abs(tx-RX)<3)continue;
    solid[idx(tx,ty)]=1;
    const kr=rng();
    trees.push({x:tx*16+8,y:ty*16+16,seed:RI(0,3),
      kind: kr<0.45?0 : kr<0.70?1 : kr<0.90?2 : 3});
  }
  trees.sort((a,b)=>a.y-b.y);

  /* pond in the far east field */
  const pcx=80, pcy=20, pr=4;
  for(let ty=pcy-pr;ty<=pcy+pr;ty++)for(let tx=pcx-pr;tx<=pcx+pr;tx++){
    if(!inMap(tx,ty)||sideOf(tx,ty))continue;
    if(Math.hypot(tx-pcx,ty-pcy)<=pr){ ground[idx(tx,ty)]=GID.water; solid[idx(tx,ty)]=1; }
  }

  /* eye glints in the treeline beyond the bank */
  for(let i=0;i<B.GLINT_COUNT;i++){
    const side=RI(0,3); let tx,ty;
    if(side===0){tx=RI(BANK.x0-9,BANK.x1+9);ty=RI(BANK.y0-9,BANK.y0-3);}
    else if(side===1){tx=RI(BANK.x0-9,BANK.x1+9);ty=RI(BANK.y1+3,BANK.y1+9);}
    else if(side===2){tx=RI(BANK.x0-9,BANK.x0-3);ty=RI(BANK.y0,BANK.y1);}
    else {tx=RI(BANK.x1+3,BANK.x1+9);ty=RI(BANK.y0,BANK.y1);}
    if(!inMap(tx,ty))continue;
    glints.push({x:tx*16+RI(2,13),y:ty*16+RI(2,13),ph:R(0,6.28),sp:R(0.4,1.4)});
  }
  genDecor();
}

function genDecor(){
  /* ground decor */
  const bridgeNear=(tx,ty)=>{
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)
      if(inMap(tx+dx,ty+dy)&&(flags[idx(tx+dx,ty+dy)]&9))return true;
    return false;
  };
  for(let ty=1;ty<MH-1;ty++)for(let tx=1;tx<MW-1;tx++){
    const i=idx(tx,ty), gid=ground[i];
    const px=tx*16, py=ty*16;
    if(gid===GID.water){
      if(rng()<0.045 && !bridgeNear(tx,ty))
        decor.push({t:'lily',x:px+RI(3,11),y:py+RI(3,11),seed:RI(0,99)});
      continue;
    }
    if(solid[i]) continue;
    if(gid===GID.grass0||gid===GID.grass1||gid===GID.bank){
      const nearW = (inMap(tx-1,ty)&&ground[idx(tx-1,ty)]===GID.water)||
                    (inMap(tx+1,ty)&&ground[idx(tx+1,ty)]===GID.water)||
                    (inMap(tx,ty-1)&&ground[idx(tx,ty-1)]===GID.water)||
                    (inMap(tx,ty+1)&&ground[idx(tx,ty+1)]===GID.water);
      if(nearW && rng()<0.5){
        decor.push({t:'reed',x:px+RI(3,12),y:py+RI(8,15),seed:RI(0,99)}); continue;
      }
      const r=rng();
      if(r<0.055) decor.push({t:'tuft',x:px+RI(2,12),y:py+RI(5,14),seed:RI(0,99)});
      else if(r<0.075) decor.push({t:'pebble',x:px+RI(2,13),y:py+RI(2,13),seed:RI(0,99)});
      else if(r<0.092 && (region.depth>0||!inR(tx,ty,BANK.x0,BANK.y0,BANK.x1,BANK.y1)))
        decor.push({t:'wf',x:px+RI(2,12),y:py+RI(2,12),seed:RI(0,99)});
    }
  }
  for(const t of trees){
    if(rng()<0.3){
      const mx=t.x+RI(-10,10), my=t.y+RI(2,9);
      const mtx=Math.floor(mx/16), mty=Math.floor(my/16);
      if(inMap(mtx,mty)&&ground[idx(mtx,mty)]!==GID.water&&!solid[idx(mtx,mty)])
        decor.push({t:'shroom',x:mx,y:my,seed:RI(0,99)});
    }
  }
}

function hashSeed(b,d){
  let h=2166136261; const t=b+'|'+d;
  for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619);}
  return h>>>0;
}
const TOWNS={
  N:{2:{name:'Coldharrow',   blurb:'waystation under the pass'},
     5:{name:'Hoarfast Hold',blurb:'the last roof before the teeth'}},
  E:{2:{name:'Briarfold',    blurb:'a logging hamlet'},
     5:{name:'Thornkeep',    blurb:'a stockade in the deep wood'}},
  S:{2:{name:'Marrowmere',   blurb:'stilts over the fen'},
     5:{name:'Mirefast Landing',blurb:'the last dry ground'}},
  W:{2:{name:'Stonecut',     blurb:'a quarry camp'},
     5:{name:'Deepcut Station',blurb:'cut into the shelf'}}
};
function townInfo(b,d){ return (TOWNS[b]&&TOWNS[b][d]) || {name:BRANCHES[b].label+' Camp',blurb:'a roadside camp'}; }

/* a palisaded settlement straddling the road, deep on a branch */
function genTown(branchKey, depth){
  clearWorld();
  const info=townInfo(branchKey,depth);
  region={branch:branchKey, depth:depth, name:info.name,
          interior:false, settlement:true, blurb:info.blurb};
  rng=mulberry32(hashSeed('town:'+branchKey,depth));
  const wr=mulberry32(hashSeed('townw:'+branchKey,depth));
  const vert=(branchKey==='N'||branchKey==='S');

  for(let ty=0;ty<MH;ty++)for(let tx=0;tx<MW;tx++)
    ground[idx(tx,ty)] = wr()<0.5?GID.grass0:GID.grass1;

  function road(tx,ty){ const i=idx(tx,ty);
    if(inMap(tx,ty)&&ground[i]!==GID.water) ground[i]=GID.road; }
  if(vert){ for(let ty=0;ty<MH;ty++)for(let d=-1;d<=1;d++) road(RX+d,ty); }
  else    { for(let tx=0;tx<MW;tx++)for(let d=-1;d<=1;d++) road(tx,RY+d); }

  buildRim([], [branchKey, OPP[branchKey]], wr);
  dressGate(branchKey, BRANCHES[branchKey].label, 'DEEPER');
  dressGate(OPP[branchKey], depth-1<=0?'HAVENBROOK':BRANCHES[branchKey].label, 'BACK');
  addExit(branchKey, {branch:branchKey, depth:depth+1, entryDir:OPP[branchKey]});
  addExit(OPP[branchKey], {branch: depth-1>0?branchKey:null, depth:depth-1, entryDir:branchKey});

  /* ---- the stockade ---- */
  const HW=vert?10:14, HH=vert?13:9;
  const X0=RX-HW, X1=RX+HW, Y0=RY-HH, Y1=RY+HH;
  region.cx=RX*16+8; region.cy=RY*16+8;
  for(let ty=Y0;ty<=Y1;ty++)for(let tx=X0;tx<=X1;tx++){
    if(!inMap(tx,ty))continue;
    const i=idx(tx,ty);
    if(ground[i]!==GID.road) ground[i]= (Math.abs(tx-RX)<6||Math.abs(ty-RY)<4)?GID.cobble:GID.gravel;
    flags[i]|=2;
  }
  for(let tx=X0;tx<=X1;tx++)for(const ty of [Y0,Y1]){
    if(!inMap(tx,ty)||Math.abs(tx-RX)<=1&&vert)continue;
    solid[idx(tx,ty)]=1; wallTiles.push({tx,ty,palisade:true});
  }
  for(let ty=Y0+1;ty<Y1;ty++)for(const tx of [X0,X1]){
    if(!inMap(tx,ty)||Math.abs(ty-RY)<=1&&!vert)continue;
    solid[idx(tx,ty)]=1; wallTiles.push({tx,ty,palisade:true});
  }

  /* lanes inside */
  function path(tx,ty){ if(!inMap(tx,ty))return; const i=idx(tx,ty);
    if(ground[i]===GID.road||solid[i])return; ground[i]=GID.gravel; }
  if(vert){ for(let tx=X0+1;tx<X1;tx++){ path(tx,RY-5); path(tx,RY+5); } }
  else    { for(let ty=Y0+1;ty<Y1;ty++){ path(RX-6,ty); path(RX+6,ty); } }

  /* buildings: a tavern and a store always, plus houses and a trade */
  const roofs=['thatch','shingle','slate'], walls=['timber','timber','stone'];
  const plan = vert
    ? [[RX-8,RY-11,5,4,'tavern'],[RX+3,RY-11,6,4,'store'],
       [RX-8,RY-4,5,4, depth>=5?'guard':'smithy'],[RX+4,RY-4,4,4,'home'],
       [RX-8,RY+3,4,4,'home'],[RX+4,RY+3,5,4, depth>=5?'chapel':'stable'],
       [RX-7,RY+9,4,3,'home'],[RX+4,RY+9,4,3,'home']]
    : [[RX-12,RY-7,5,4,'tavern'],[RX-4,RY-7,6,4,'store'],[RX+5,RY-7,5,4,'home'],
       [RX-12,RY+3,5,4, depth>=5?'guard':'smithy'],[RX-4,RY+3,4,4,'home'],
       [RX+5,RY+3,5,4, depth>=5?'chapel':'stable'],[RX+11,RY-7,3,4,'home']];
  const usedNames={tavern:'The '+info.name+' Rest', store:info.name+' Goods',
    smithy:info.name+' Forge', chapel:'Chapel of the Road',
    stable:info.name+' Stables', guard:'Watchhouse'};
  let bi=0;
  for(const p of plan){
    const k=p[4], r=roofs[bi%3], wl=walls[bi%3];
    placeBuilding(p[0],p[1],p[2],p[3],r,wl,k, usedNames[k]||null,
      {chim: k!=='stable', sign: k!=='home'});
    bi++;
  }

  /* town furniture */
  addProp('well', RX+2, RY-2, true);
  addProp('cart', RX-3, RY+2, true);
  addProp('woodpile', RX+3, RY+4, true);
  addProp('hay', RX-4, RY-4, true);
  addProp('trough', RX-3, RY-4, true);
  for(let i=0;i<3;i++) addProp('stall', RX-3+i*3, RY+(vert?7:3), true);
  addProp('bench', RX+2, RY+3, false);
  addProp('planter', RX-2, RY-3, false);
  for(let i=0;i<4;i++) addProp('flower', RX-5+i*4, RY+(vert?-8:6), false);
  const lampSpots = vert
    ? [[RX-6,RY-8],[RX+6,RY-8],[RX-6,RY+8],[RX+6,RY+8],[RX-3,RY],[RX+3,RY]]
    : [[RX-9,RY-4],[RX+9,RY-4],[RX-9,RY+4],[RX+9,RY+4],[RX,RY-3],[RX,RY+3]];
  for(const l of lampSpots) lamps.push({x:l[0]*16+8,y:l[1]*16+8});

  const lines=[
    'Road past here gets mean. Rest while you can.',
    'We hold the gate. That\u2019s all anybody holds out here.',
    'Havenbrook feels a long way back, doesn\u2019t it.',
    'Traders stopped coming through in spring.',
    'Lamps stay lit all night. Ask the watch why.'
  ];
  const folk = vert
    ? [[RX-4,RY-6],[RX+4,RY-1],[RX-3,RY+6],[RX+3,RY+8]]
    : [[RX-7,RY-2],[RX+2,RY-1],[RX-2,RY+2],[RX+8,RY+1]];
  for(let i=0;i<folk.length;i++){
    const f=folk[i];
    if(inMap(f[0],f[1])&&!solid[idx(f[0],f[1])])
      npcs.push(mkNpc(f[0],f[1], i===0?'the gatekeep':'a settler', lines[i%lines.length], false));
  }

  /* wilderness outside the stockade */
  for(let k=0;k<10;k++){
    const cx2=RI(BORDER+2,MW-BORDER-3), cy2=RI(BORDER+2,MH-BORDER-3);
    for(let j=0;j<RI(3,6);j++){
      const tx=cx2+RI(-2,2), ty=cy2+RI(-2,2);
      if(!inMap(tx,ty)||sideOf(tx,ty)||inR(tx,ty,X0-1,Y0-1,X1+1,Y1+1))continue;
      const i=idx(tx,ty);
      if(solid[i]||ground[i]===GID.road)continue;
      rocks.push({x:tx*16+8,y:ty*16+15,seed:RI(0,255),big:wr()<0.45});
      solid[i]=1;
    }
  }
  for(let i=0;i<340;i++){
    const tx=RI(BORDER,MW-BORDER-1), ty=RI(BORDER,MH-BORDER-1);
    if(!inMap(tx,ty)||sideOf(tx,ty))continue;
    if(inR(tx,ty,X0-2,Y0-2,X1+2,Y1+2))continue;
    const gid=ground[idx(tx,ty)];
    if(gid===GID.road||gid===GID.water||solid[idx(tx,ty)])continue;
    if(vert?Math.abs(tx-RX)<3:Math.abs(ty-RY)<3)continue;
    solid[idx(tx,ty)]=1;
    const kr=wr();
    trees.push({x:tx*16+8,y:ty*16+16,seed:RI(0,3),
      kind: branchKey==='N'?(kr<0.6?1:3) : kr<0.5?0 : kr<0.75?1 : kr<0.9?2 : 3});
  }
  trees.sort((a,b)=>a.y-b.y);
  for(let i=0;i<B.GLINT_COUNT+depth*4;i++){
    const tx=RI(BORDER,MW-BORDER-1), ty=RI(BORDER,MH-BORDER-1);
    if(!inMap(tx,ty)||inR(tx,ty,X0-3,Y0-3,X1+3,Y1+3))continue;
    glints.push({x:tx*16+RI(2,13),y:ty*16+RI(2,13),ph:R(0,6.28),sp:R(0.4,1.4)});
  }
  genDecor();
}

function genWild(branchKey, depth){
  clearWorld();
  const BR=BRANCHES[branchKey];
  const nm=BR.names[Math.min(depth-1,BR.names.length-1)];
  region={branch:branchKey, depth:depth, interior:false, settlement:false,
          name: depth>BR.names.length ? nm+' \u00b7 '+depth : nm};
  rng=mulberry32(hashSeed('wild:'+branchKey,depth));
  const wr=mulberry32(hashSeed(branchKey,depth));
  const vert = (branchKey==='N'||branchKey==='S');

  for(let ty=0;ty<MH;ty++)for(let tx=0;tx<MW;tx++)
    ground[idx(tx,ty)] = wr()<0.5?GID.grass0:GID.grass1;

  /* quarry branch: gravel flats. frost branch: bare rock patches. */
  if(branchKey==='W'||branchKey==='N'){
    const gid = branchKey==='W'?GID.gravel:GID.rockg;
    for(let k=0;k<10;k++){
      const cx=RI(BORDER+3,MW-BORDER-4), cy=RI(BORDER+3,MH-BORDER-4), r=RI(3,8);
      for(let ty=cy-r;ty<=cy+r;ty++)for(let tx=cx-r;tx<=cx+r;tx++){
        if(!inMap(tx,ty)||sideOf(tx,ty))continue;
        if(Math.hypot(tx-cx,ty-cy)<=r*(0.6+wr()*0.5)) ground[idx(tx,ty)]=gid;
      }
    }
  }

  /* the road: runs the whole axis, gate to gate */
  function road(tx,ty){ const i=idx(tx,ty);
    if(ground[i]!==GID.water) ground[i]=GID.road; }
  if(vert){ for(let ty=0;ty<MH;ty++)for(let d=-1;d<=1;d++) road(RX+d,ty); }
  else    { for(let tx=0;tx<MW;tx++)for(let d=-1;d<=1;d++) road(tx,RY+d); }

  /* a stream across the road, planked where it crosses */
  const wet = (branchKey==='S') || wr()<0.6;
  if(wet){
    const at = vert ? RI(MH*0.3,MH*0.7) : RI(MW*0.3,MW*0.7);
    const w = RI(2,3);
    for(let k=0;k<(vert?MW:MH);k++){
      const wob=Math.round(Math.sin(k*0.11)*2);
      for(let o=0;o<w;o++){
        const tx = vert?k:at+o+wob, ty = vert?at+o+wob:k;
        if(!inMap(tx,ty)||sideOf(tx,ty))continue;
        ground[idx(tx,ty)]=GID.water; solid[idx(tx,ty)]=1;
      }
    }
    for(let o=-4;o<=6;o++)for(let d=-1;d<=1;d++){
      const tx = vert?RX+d:at+o, ty = vert?at+o:RY+d;
      if(!inMap(tx,ty)||sideOf(tx,ty))continue;
      const i=idx(tx,ty);
      if(ground[i]===GID.water){ ground[i]=GID.plank; solid[i]=0; flags[i]|=8; }
    }
  }

  /* ponds */
  for(let k=0;k<2;k++){
    const pcx=RI(BORDER+6,MW-BORDER-7), pcy=RI(BORDER+6,MH-BORDER-7), pr=RI(3,5);
    if(Math.abs(vert?pcx-RX:pcy-RY)<7)continue;
    for(let ty=pcy-pr;ty<=pcy+pr;ty++)for(let tx=pcx-pr;tx<=pcx+pr;tx++){
      if(!inMap(tx,ty)||sideOf(tx,ty))continue;
      if(Math.hypot(tx-pcx,ty-pcy)<=pr){ ground[idx(tx,ty)]=GID.water; solid[idx(tx,ty)]=1; }
    }
  }

  /* rim: rock all round, gates on the travel axis only */
  buildRim([], [branchKey, OPP[branchKey]], wr);
  dressGate(branchKey, BRANCHES[branchKey].label, 'DEEPER');
  dressGate(OPP[branchKey], depth===1?'HAVENBROOK':BRANCHES[branchKey].label, 'BACK');
  addExit(branchKey, {branch:branchKey, depth:depth+1, entryDir:OPP[branchKey]});
  addExit(OPP[branchKey], {branch: depth-1>0?branchKey:null, depth:depth-1, entryDir:branchKey});

  /* rock outcrops */
  for(let k=0;k<14;k++){
    const cx=RI(BORDER+2,MW-BORDER-3), cy=RI(BORDER+2,MH-BORDER-3);
    for(let j=0;j<RI(3,7);j++){
      const tx=cx+RI(-2,2), ty=cy+RI(-2,2);
      if(!inMap(tx,ty)||sideOf(tx,ty))continue;
      const i=idx(tx,ty);
      if(solid[i]||ground[i]===GID.road||ground[i]===GID.plank||ground[i]===GID.water)continue;
      rocks.push({x:tx*16+8,y:ty*16+15,seed:RI(0,255),big:wr()<0.45});
      solid[i]=1;
    }
  }

  /* a ruin off the road, and a cold camp */
  (function ruin(){
    const rx=RI(BORDER+5,MW-BORDER-10), ry=RI(BORDER+5,MH-BORDER-9);
    if(Math.abs(vert?rx-RX:ry-RY)<7)return;
    for(let tx=rx;tx<rx+6;tx++)for(const ty of [ry,ry+4]){
      if(!inMap(tx,ty)||sideOf(tx,ty)||wr()<0.35)continue;
      solid[idx(tx,ty)]=1; wallTiles.push({tx,ty,ruin:true});
    }
    for(let ty=ry+1;ty<ry+4;ty++)for(const tx of [rx,rx+5]){
      if(!inMap(tx,ty)||sideOf(tx,ty)||wr()<0.35)continue;
      solid[idx(tx,ty)]=1; wallTiles.push({tx,ty,ruin:true});
    }
    for(let k=0;k<5;k++){
      const tx=rx+RI(0,5), ty=ry+RI(1,3);
      if(inMap(tx,ty)&&!solid[idx(tx,ty)]) addProp('rubble',tx,ty,false);
    }
  })();
  (function camp(){
    for(let t=0;t<40;t++){
      const tx=RI(BORDER+3,MW-BORDER-4), ty=RI(BORDER+3,MH-BORDER-4);
      if(solid[idx(tx,ty)]||ground[idx(tx,ty)]===GID.water)continue;
      if(Math.abs(vert?tx-RX:ty-RY)<5||Math.abs(vert?tx-RX:ty-RY)>16)continue;
      addProp('campfire',tx,ty,true);
      if(!solid[idx(tx+1,ty)])addProp('crate',tx+1,ty,true);
      if(!solid[idx(tx-1,ty+1)])addProp('barrel',tx-1,ty+1,true);
      lamps.push({x:tx*16+8,y:ty*16+8});
      break;
    }
  })();

  /* trees: thick in the Thornwood, sparse on the Frost Pass */
  const density = branchKey==='E'?520 : branchKey==='N'?170 : 320;
  for(let i=0;i<density;i++){
    const tx=RI(BORDER,MW-BORDER-1), ty=RI(BORDER,MH-BORDER-1);
    if(!inMap(tx,ty)||sideOf(tx,ty))continue;
    const gid=ground[idx(tx,ty)];
    if(gid===GID.road||gid===GID.water||gid===GID.plank||solid[idx(tx,ty)])continue;
    if(vert?Math.abs(tx-RX)<3:Math.abs(ty-RY)<3)continue;
    solid[idx(tx,ty)]=1;
    const kr=wr();
    let kind;
    if(branchKey==='N') kind = kr<0.60?1 : kr<0.85?3 : 2;
    else if(branchKey==='E') kind = kr<0.55?0 : kr<0.80?1 : kr<0.92?2 : 3;
    else if(branchKey==='S') kind = kr<0.40?0 : kr<0.60?2 : 3;
    else kind = kr<0.35?0 : kr<0.55?1 : kr<0.70?2 : 3;
    trees.push({x:tx*16+8,y:ty*16+16,seed:RI(0,3),kind:kind});
  }
  trees.sort((a,b)=>a.y-b.y);

  /* eyes in the dark, thicker the deeper you are */
  for(let i=0;i<B.GLINT_COUNT+depth*6;i++){
    const tx=RI(BORDER,MW-BORDER-1), ty=RI(BORDER,MH-BORDER-1);
    if(!inMap(tx,ty))continue;
    if(vert?Math.abs(tx-RX)<6:Math.abs(ty-RY)<6)continue;
    glints.push({x:tx*16+RI(2,13),y:ty*16+RI(2,13),ph:R(0,6.28),sp:R(0.4,1.4)});
  }

  genDecor();
}

function solidAt(px,py){
  const tx=Math.floor(px/16), ty=Math.floor(py/16);
  if(!inMap(tx,ty))return 1;
  return solid[idx(tx,ty)];
}
function moveEntity(e,dx,dy){
  const hw=5,hh=3;
  if(dx!==0){
    const nx=e.x+dx, sx=dx>0?nx+hw:nx-hw;
    if(!solidAt(sx,e.y-hh)&&!solidAt(sx,e.y+hh)) e.x=nx;
  }
  if(dy!==0){
    const ny=e.y+dy, sy=dy>0?ny+hh:ny-hh;
    if(!solidAt(e.x-hw,sy)&&!solidAt(e.x+hw,sy)) e.y=ny;
  }
  e.x=Math.min(Math.max(e.x,6),MW*16-6);
  e.y=Math.min(Math.max(e.y,6),MH*16-6);
}

function applyTravel(to){

  camX = MW*16<=LW ? (MW*16-LW)/2 : Math.max(0,Math.min(player.x-LW/2, MW*16-LW));
  camY = MH*16<=LH ? (MH*16-LH)/2 : Math.max(0,Math.min(player.y-LH/2, MH*16-LH));
  spawnAnimals();
  if(region.depth>0) spawnWildPacks();
  else { spawnWolfPack(66*16,36*16,4); spawnWolfPack(76*16,26*16,3); }
  region.cx=region.cx||TOWN_CX; region.cy=region.cy||TOWN_CY;
  banner={name:region.name,
          sub: region.depth===0 ? 'SAFE GROUND'
             : (region.settlement ? (region.blurb||'a settlement').toUpperCase()
                +'  \u00b7  DEPTH '+region.depth
             : 'DEPTH '+region.depth+'  \u00b7  '+BRANCHES[to.branch||region.branch||'N'].label),
          t:0};
}

/* day/night: 0..1 ambient light */
function hourNow(){ return gameT/60; }
function lightLevel(){
  const h=hourNow();
  if(h>=7&&h<17) return 1.0;
  if(h>=17&&h<19.5) return 1.0-(h-17)/2.5*0.65;    // dusk
  if(h>=19.5||h<3) return 0.35;                     // night
  if(h>=3&&h<5) return 0.30;                        // deep
  return 0.30+(h-5)/2*0.70;                         // dawn
}
const isNight = ()=>{ const h=hourNow(); return h>=19.5||h<5; };

function nearestDoorDist(){

  for(const dr of doors){ if(dr.exit)continue;
    d=Math.min(d,Math.hypot(dr.tx*16+8-player.x, dr.ty*16+8-player.y)); }
  return d;
}
function nearestSignDist(){
  let d=1e9;
  for(const p of props){ if(p.type!=='sign')continue;
    d=Math.min(d,Math.hypot(p.x-player.x,p.y-player.y)); }
  return d;
}

function nearestWolfDist(){

    d=Math.min(d, Math.hypot(w.x-player.x,w.y-player.y)); }

}
function updateHints(dt){
  if(activeHint){
    const s=activeHint; s.t+=dt;
    if(s.leaving===undefined && s.h.sat(s)){ hintFlags[s.h.id]=true; s.leaving=0.5; }

    if(s.t>B.HINT_GIVEUP_S){ activeHint=null; }
    return;
  }
  for(const h of hints){
    if(hintFlags[h.id]) continue;
    if(h.trig()){ activeHint={h,t:0,movedPx:0,cast:false}; break; }
  }
}

function toLogical(e){
  const r = cv.getBoundingClientRect();
  const k = cv.width/Math.max(1,r.width);
  return {x:((e.clientX-r.left)*k)/SCALE, y:((e.clientY-r.top)*k)/SCALE};
}
let fsTried=false;
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); cv.setPointerCapture(e.pointerId);
  if(!fsTried){ fsTried=true;
    try{ const el=document.documentElement;
      if(el.requestFullscreen) el.requestFullscreen().catch(()=>{}); }catch(_){}}
  const p=toLogical(e);
  for(const k in buttons){const b=buttons[k];
    if(Math.hypot(p.x-b.x,p.y-b.y)<=b.r+5){ pressButton(k); return; }}

    stick.active=true; stick.id=e.pointerId;

  }
});

    const p=toLogical(e);
    let dx=p.x-stick.ox, dy=p.y-stick.oy;
    const m=Math.hypot(dx,dy), MAX=22;
    if(m>MAX){dx=dx/m*MAX;dy=dy/m*MAX;}
    stick.dx=dx; stick.dy=dy;
  }
});
function endPointer(e){

}

/* ---------------- audio (minimal) --------------------------------- */
let AC=null;
function beep(freq,dur,vol,type){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),ga=AC.createGain();
    o.type=type||'triangle'; o.frequency.value=freq;
    ga.gain.setValueAtTime(vol||0.05,AC.currentTime);
    ga.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
    o.connect(ga).connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(_){}
}

let shakeAether=0;
function tryDodge(){
  if(player.dodgeT>0) return;
  if(player.aether < B.DODGE_COST){ shakeAether=0.4; return; }
  let vx=stick.dx, vy=stick.dy;
  if(keys['a']||keys['arrowleft'])vx=-1; if(keys['d']||keys['arrowright'])vx=1;
  if(keys['w']||keys['arrowup'])vy=-1;  if(keys['s']||keys['arrowdown'])vy=1;
  const m=Math.hypot(vx,vy)||1;

  player.dodgeVX = vx/m*300; player.dodgeVY = vy/m*300;
  beep(520,0.08,0.04,'square');

function tryCast(){
  if(inTown(player.x,player.y)) return;
  if(player.aether < B.NOVA.cost){ shakeAether=0.4; return; }
  player.aether -= B.NOVA.cost;

  frostPatches.push({x:player.x,y:player.y,r:r*0.85,t:0,life:3.5});
  for(const w of wolves){
    if(w.hp<=0)continue;
    if(Math.hypot(w.x-player.x,w.y-player.y)<=r){
      hurtWolf(w, B.NOVA.dmg, player.x, player.y, 2.2);
      w.chill = B.NOVA.chillDur;

  beep(880,0.18,0.06,'sine'); beep(1320,0.25,0.03,'sine');
  hitstop = Math.max(hitstop, 2/60);
}
function hurtWolf(w,dmg,fx,fy,kb){
  w.hp -= dmg; w.flashT = 0.09; w.hitT = 0.09;
  const a=Math.atan2(w.y-fy,w.x-fx);

  sparks.push({x:w.x-Math.cos(a)*5, y:w.y-4-Math.sin(a)*5, t:0, life:0.15, ang:a});
  for(let i=0;i<7;i++){
    const pa=a+R(-0.9,0.9), sp=R(30,95);

  }
  if(w.hp<=0){

    for(let i=0;i<12;i++){
      const pa=R(0,Math.PI*2), sp=R(20,80);
      particles.push({x:w.x,y:w.y-4,vx:Math.cos(pa)*sp,vy:Math.sin(pa)*sp-18,
        t:R(0.25,0.55), col: i%3?PAL.wolfA:PAL.wolfB, sz: i%4===0?2:1});
    }

      const pa=R(0,Math.PI*2), sp=R(8,30);
      particles.push({x:w.x+R(-5,5),y:w.y+R(-1,2),

        t:R(0.3,0.7), col:'#9d9384', sz: i%3===0?2:1});

    const n=RI(3,7)+region.depth*2;
    for(let i=0;i<n;i++){
      const a2=R(0,Math.PI*2), s=R(30,80);
      coins.push({x:w.x,y:w.y,vx:Math.cos(a2)*s,vy:Math.sin(a2)*s,t:0});
    }
    respawnT = 8;
  } else beep(300,0.05,0.04,'square');

function hurtPlayer(dmg){
  if(player.iframes>0 || inTown(player.x,player.y)) return;
  player.hp -= dmg;
  player.aether *= (1-B.AETHER_HIT_LOSS);
