}

/* ---------------- update -------------------------------------------- */
let camX=0, camY=0;
function update(dt){
  if(fade){
    fade.t+=dt;
    if(fade.phase==='out'&&fade.t>=0.32){ applyTravel(fade.to); fade.phase='in'; fade.t=0; }
    else if(fade.phase==='in'&&fade.t>=0.32){ fade=null; }
    if(fade&&fade.phase==='out') return;
  }
  if(banner){ banner.t+=dt; if(banner.t>4.2) banner=null; }
  if(doorLock>0) doorLock-=dt;
  if(doorLock<=0 && !fade){
    const ptx=Math.floor(player.x/16), pty=Math.floor(player.y/16);
    for(const d of doors){
      if(d.tx!==ptx||d.ty!==pty)continue;
      if(d.exit) leaveBuilding(); else enterBuilding(d.b);
      break;
    }
  }
  for(const n of npcs){
    if(n.fixed){ n.moving=false; continue; }
    n.wanderT-=dt;
    if(n.wanderT<=0){ n.wanderT=R(1.2,3.5); n.wa=R(0,6.28); n.wm=rng()<0.55; }
    if(n.wm){
      const sp=15, mx=Math.cos(n.wa)*sp*dt, my=Math.sin(n.wa)*sp*dt;
      const bx=n.x, by=n.y;
      moveEntity(n,mx,my);
      if(Math.hypot(n.x-n.hx,n.y-n.hy)>44){ n.x=bx; n.y=by; n.wa+=Math.PI; }
      n.moving = (n.x!==bx||n.y!==by);
      if(n.moving){
        n.dir = Math.abs(mx)>Math.abs(my) ? (mx>0?'right':'left') : (my>0?'down':'up');
        n.animT+=dt; if(n.animT>0.22){n.animT=0;n.frame=1-n.frame;}
      }
    } else n.moving=false;
  }
  if(!fade){
    for(const e of exits){
      if(player.x>=e.px0&&player.x<e.px1&&player.y>=e.py0&&player.y<e.py1){
        beginTravel(e.to); break;
      }
    }
  }
  if(hitstop>0){ hitstop-=dt; return; }
  clockAcc += dt*1000;
  gameT = 8*60 + (clockAcc/B.DAY_MS)*24*60;
  while(gameT>=24*60){gameT-=24*60; dayN++; clockAcc-=B.DAY_MS;}

  /* --- player --- */
  let vx = stick.dx/22, vy = stick.dy/22;
  if(keys['a']||keys['arrowleft'])vx=-1; if(keys['d']||keys['arrowright'])vx=1;
  if(keys['w']||keys['arrowup'])vy=-1;  if(keys['s']||keys['arrowdown'])vy=1;
  if(keys[' ']){keys[' ']=false; tryDodge();}
  if(keys['e']||keys['enter']){keys['e']=false;keys['enter']=false; tryCast();}
  const mag = Math.hypot(vx,vy);
  if(mag>1){vx/=mag;vy/=mag;}
  player.moving = mag>0.15;
  if(player.dodgeT>0){
    player.dodgeT-=dt;
    moveEntity(player, player.dodgeVX*dt, player.dodgeVY*dt);
    particles.push({x:player.x,y:player.y-8,vx:0,vy:0,t:0.15,col:'#ffffff',sz:2});
  } else if(player.moving){
    const dx=vx*B.PLAYER_SPEED*dt, dy=vy*B.PLAYER_SPEED*dt;
    moveEntity(player,dx,dy);
    if(Math.abs(vx)>Math.abs(vy)) player.dir = vx>0?'right':'left';
    else player.dir = vy>0?'down':'up';
    player.animT+=dt;
    if(player.animT>0.18){player.animT=0;player.frame=1-player.frame;}
    if(activeHint&&activeHint.h.id===1)activeHint.movedPx+=Math.hypot(dx,dy);
    stillFor=0;
    rustleT-=dt;
    if(rustleT<=0){
      rustleT=0.16;
      const gtx=Math.floor(player.x/16), gty=Math.floor(player.y/16);
      if(inMap(gtx,gty)){
        const gid=ground[idx(gtx,gty)];
        if(gid===GID.grass0||gid===GID.grass1||gid===GID.bank)
          particles.push({x:player.x+R(-3,3),y:player.y,vx:R(-6,6),vy:R(-9,-4),
            t:R(0.2,0.4),col:'#5a8a4a',sz:1});
        else if(gid===GID.road||gid===GID.cobble)
          particles.push({x:player.x+R(-3,3),y:player.y,vx:R(-5,5),vy:R(-6,-2),
            t:R(0.2,0.35),col:'#a08a66',sz:1});
      }
    }
  } else { player.frame=0; stillFor+=dt; }
  player.iframes=Math.max(0,player.iframes-dt);
  player.flashT=Math.max(0,player.flashT-dt);
  player.lastHitT+=dt;

  player.moveSamples.push({t:performance.now()/1000,x:player.x,y:player.y});
  while(player.moveSamples.length>2 &&
        player.moveSamples[0].t < performance.now()/1000 - B.FLOW_MOVE_WINDOW)
    player.moveSamples.shift();
  const ms0=player.moveSamples[0], msN=player.moveSamples[player.moveSamples.length-1];
  const windowDist = Math.hypot(msN.x-ms0.x, msN.y-ms0.y);

  /* --- flow --- */
  const near = nearestWolfDist();
  const inT = inTown(player.x,player.y);
  flowActive = !inT && player.lastHitT>=B.FLOW_DELAY && near<6*16
               && windowDist>=B.FLOW_MOVE_PX;
  if(flowActive) flowT+=dt; else flowT=0;
  let flowMult=0;
  for(let i=0;i<B.FLOW_TIERS.length;i++)
    if(flowT>=B.FLOW_TIERS[i][0])flowMult=B.FLOW_TIERS[i][1];

  /* --- aether --- */
  if(inT){
    player.aether = Math.max(0, player.aether - 20*dt);
  } else {
    let enemiesIn6=0;
    for(const w of wolves)if(w.hp>0 &&
      Math.hypot(w.x-player.x,w.y-player.y)<6*16)enemiesIn6++;
    let gain = B.AETHER_BASE;
    gain += Math.min(enemiesIn6,B.AETHER_PROX_CAP)*B.AETHER_PROX;
    gain += flowActive?B.AETHER_FLOW:0;
    gain *= flowMult||1;
    gain *= player.moving?1.0:B.AETHER_STILL;
    player.aether = Math.min(player.aetherMax, player.aether + gain*dt);
  }

  /* --- auto-fire --- */
  player.fireT -= dt;
  if(!inT && player.fireT<=0){
    let best=null, bd=B.SLING.range;
    for(const w of wolves){
      if(w.hp<=0)continue;
      const d=Math.hypot(w.x-player.x,w.y-player.y);
      if(d<bd){bd=d;best=w;}
    }
    if(best){
      player.fireT = B.SLING.cd;
      const a=Math.atan2(best.y-6-player.y+8, best.x-player.x);
      projectiles.push({x:player.x,y:player.y-8,
        vx:Math.cos(a)*B.SLING.speed, vy:Math.sin(a)*B.SLING.speed, t:0.8});
      beep(700+R(-60,60),0.03,0.015,'triangle');
    }
  }
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.t-=dt;
    let dead = p.t<=0 || solidAt(p.x,p.y);
    if(!dead)for(const w of wolves){
      if(w.hp<=0)continue;
      if(Math.hypot(w.x-p.x,w.y-6-p.y)<7){
        hurtWolf(w,B.SLING.dmg,player.x,player.y,1); dead=true; break;
      }
    }
    if(dead)projectiles.splice(i,1);
  }

  /* --- wolves --- */
  function stepWolf(w,dx,dy){ moveEntity(w,dx,dy); if(Math.abs(dx)>0.01)w.face=dx>0?1:-1; }
  for(let i=wolves.length-1;i>=0;i--){
    const w=wolves[i];
    if(w.hp<=0){ w.deadT+=dt; w.flashT=0; w.hitT=0;
      if(w.deadT>1.2)wolves.splice(i,1); continue; }
    w.flashT=Math.max(0,w.flashT-dt);
    w.hitT=Math.max(0,(w.hitT||0)-dt);
    w.chill=Math.max(0,w.chill-dt);
    w.animT+=dt; if(w.animT>0.15){w.animT=0;w.frame=1-w.frame;}
    if(Math.abs(w.lvx)>1||Math.abs(w.lvy)>1){
      moveEntity(w,w.lvx*dt,w.lvy*dt);
      w.lvx*=0.85; w.lvy*=0.85;
    }
    const dx=player.x-w.x, dy=player.y-w.y, d=Math.hypot(dx,dy)||1;
    const slow = w.chill>0?B.NOVA.chillSlow:1;
    const playerSafe = inT;
    if(playerSafe || d>150){
      w.stT-=dt;
      if(w.stT<=0){w.stT=R(1,3);w.wa=R(0,Math.PI*2);w.wm=rng()<0.6;}
      if(w.wm){ const s=18*slow;
        stepWolf(w, Math.cos(w.wa)*s*dt, Math.sin(w.wa)*s*dt); }
      w.state='idle';
    } else if(w.state==='lunge'){
      w.lungeT-=dt;
      stepWolf(w, w.lvx2*dt*slow, w.lvy2*dt*slow);
      if(d<12){ hurtPlayer(6*(w.dmg||1)); w.state='circle'; w.cd=R(2,3.5); }
      if(w.lungeT<=0){ w.state='circle'; w.cd=R(2,3.5); }
    } else {
      w.state='circle';
      w.circA = Math.atan2(w.y-player.y, w.x-player.x)
              + w.circDir*0.9*dt*slow;
      const tx = player.x+Math.cos(w.circA)*Math.min(d,44);
      const ty = player.y+Math.sin(w.circA)*Math.min(d,44);
      const ma=Math.atan2(ty-w.y,tx-w.x), s=46*slow;
      stepWolf(w, Math.cos(ma)*s*dt, Math.sin(ma)*s*dt);
      w.cd=(w.cd||R(1,2.5))-dt;
      if(w.cd<=0 && d<70 && d>16){
        w.state='lunge'; w.lungeT=0.45;
        const la=Math.atan2(dy,dx);
        w.lvx2=Math.cos(la)*150; w.lvy2=Math.sin(la)*150;
      }
      if(d<10) hurtPlayer(B.CONTACT_DPS*dt*(w.dmg||1));
    }
    /* never enter town/bridges */
    if(inTown(w.x,w.y)){
      const scx=region.cx||TOWN_CX, scy=region.cy||TOWN_CY;
      const a=Math.atan2(w.y-scy, w.x-scx);
      w.x+=Math.cos(a)*50*dt; w.y+=Math.sin(a)*50*dt;
    }
  }
  if(wolves.filter(w=>w.hp>0).length<3){
    respawnT-=dt;
    if(respawnT<=0){
      for(let tries=0;tries<80;tries++){
        const tx = region.depth===0 ? RI(58,MW-BORDER-3) : RI(BORDER+2,MW-BORDER-3);
        const ty = RI(BORDER+2,MH-BORDER-3);
        if(solid[idx(tx,ty)])continue;
        if(flags[idx(tx,ty)]&2)continue;
        if(Math.hypot(tx*16-player.x,ty*16-player.y)<130)continue;
        spawnWolfPack(tx*16,ty*16,RI(3,4+Math.min(3,region.depth)));
        break;
      }
      respawnT=8;
    }
  }

  /* --- spectators: the moat horde, night only (§11.5.3-lite) --- */
  if(isNight() && region.depth===0){
    if(spectators.length<B.SPECTATOR_CAP && rng()<dt*1.4){
      for(let tries=0;tries<20;tries++){
        const tx=RI(BANK.x0,BANK.x1), ty=RI(BANK.y0,BANK.y1);
        if(!inBankT(tx,ty))continue;
        spectators.push({x:tx*16+8,y:ty*16+8,face:1,frame:0,animT:0,
          stT:R(0,2),wa:R(0,Math.PI*2),wm:false});
        break;
      }
    }
  } else if(spectators.length && rng()<dt*3) spectators.pop();
  for(const s of spectators){
    s.animT+=dt; if(s.animT>0.3){s.animT=0;s.frame=1-s.frame;}
    s.stT-=dt;
    if(s.stT<=0){ s.stT=R(1.5,4); s.wm=rng()<0.55; s.wa=R(0,Math.PI*2); }
    if(s.wm){
      const nx=s.x+Math.cos(s.wa)*12*dt, ny=s.y+Math.sin(s.wa)*12*dt;
      const tx=Math.floor(nx/16), ty=Math.floor(ny/16);
      if(inMap(tx,ty)&&inBankT(tx,ty)&&!(flags[idx(tx,ty)]&1)&&
         ground[idx(tx,ty)]!==GID.road){ s.x=nx; s.y=ny; s.face=Math.cos(s.wa)>0?1:-1; }
      else s.wa+=Math.PI;
    } else {
      s.face = TOWN_CX>s.x?1:-1;      // face the town while idle
    }
  }

  for(let i=sparks.length-1;i>=0;i--){
    sparks[i].t+=dt; if(sparks[i].t>=sparks[i].life)sparks.splice(i,1);
  }

  /* --- coins / novas / particles --- */
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i]; c.t+=dt;
    c.x+=c.vx*dt; c.y+=c.vy*dt; c.vx*=0.9; c.vy*=0.9;
    const d=Math.hypot(c.x-player.x,c.y-player.y);
    if((c.t>B.COIN_MAGNET_DELAY && d<B.COIN_MAGNET_PX) || c.t>B.COIN_FORCE_COLLECT){
      const a=Math.atan2(player.y-c.y,player.x-c.x);
      const s=Math.max(140, 400-d*4);
      c.x+=Math.cos(a)*s*dt; c.y+=Math.sin(a)*s*dt;
    }
    if(d<7){ coins.splice(i,1); player.coins++;
      beep(1180,0.05,0.03); beep(1560,0.07,0.02); }
  }
  for(let i=novas.length-1;i>=0;i--){
    const n=novas[i]; n.t+=dt; n.r=n.rMax*Math.min(1,n.t/0.25);
    if(n.t>0.45)novas.splice(i,1);
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.t-=dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.96; p.vy*=0.96;
    if(p.t<=0)particles.splice(i,1);
  }

  /* --- chimney smoke --- */
  for(const b of buildings){
    if(!b.chim)continue;
    b.smokeT-=dt;
    if(b.smokeT<=0){
      b.smokeT=R(0.4,0.8);
      const sx=(b.tx+b.tw)*16-12, sy=b.ty*16-14;
      particles.push({x:sx+R(-1,1),y:sy,vx:R(2,6),vy:R(-11,-7),
        t:R(1.4,2.4),col:PAL.smoke,sz:2});
    }
  }

  updateAmbient(dt);
  shakeAether=Math.max(0,shakeAether-dt);
  updateHints(dt);

  const tX = player.x - LW/2, tY = player.y - LH/2 - 6;
  camX += (tX-camX)*Math.min(1,dt*6);
  camY += (tY-camY)*Math.min(1,dt*6);
  camX = MW*16<=LW ? (MW*16-LW)/2 : Math.min(Math.max(camX,0), MW*16-LW);
  camY = MH*16<=LH ? (MH*16-LH)/2 : Math.min(Math.max(camY,0), MH*16-LH);
}

/* ---------------- ambient: animals, ripples, clouds ------------------- */
function waterAt(tx,ty){ return inMap(tx,ty)&&ground[idx(tx,ty)]===GID.water; }
function sampleTile(pred){
  for(let i=0;i<300;i++){
    const tx=RI(1,MW-2), ty=RI(1,MH-2);
    if(pred(tx,ty)) return {x:tx*16+8, y:ty*16+8};
  }
  return null;
}
function spawnRipple(x,y,rMax,life){
  ripples.push({x,y,rMax:rMax||6,life:life||0.9,t:0});
}
function spawnAnimals(){
  for(let i=0;i<14;i++){
    const p=sampleTile((tx,ty)=>waterAt(tx,ty));
    if(p)animals.push({kind:'fish',x:p.x,y:p.y,a:R(0,6.28),sp:R(6,14),
      turnT:R(0,2),jT:R(4,16),jump:0});
  }
  for(let i=0;i<(region.depth===0?6:0);i++){
    const p=sampleTile((tx,ty)=>waterAt(tx,ty)&&inMoatT(tx,ty));
    if(p)animals.push({kind:'duck',x:p.x,y:p.y,a:R(0,6.28),turnT:R(0,2),
      rippleT:0,ph:R(0,6.28),face:1});
  }
  for(let i=0;i<(region.depth===0?4:0);i++){
    const p=sampleTile((tx,ty)=>inR(tx,ty,WALL.x0+2,WALL.y0+2,WALL.x1-2,WALL.y1-2)
      &&!solid[idx(tx,ty)]);
    if(p)animals.push({kind:'goose',x:p.x,y:p.y,a:R(0,6.28),turnT:R(0,2),
      frame:0,animT:0,face:1,honkT:R(2,8)});
  }
  for(let i=0;i<6;i++){
    const p=sampleTile((tx,ty)=>!inR(tx,ty,BANK.x0-1,BANK.y0-1,BANK.x1+1,BANK.y1+1)
      &&!solid[idx(tx,ty)]&&
      (ground[idx(tx,ty)]===GID.grass0||ground[idx(tx,ty)]===GID.grass1));
    if(p)animals.push({kind:'rabbit',x:p.x,y:p.y,a:R(0,6.28),turnT:R(0,2),
      frame:0,animT:0,face:1,flee:0});
  }
  for(let i=0;i<8;i++){
    animals.push({kind:'bfly',ax:0,ay:0,t:R(0,20),ph:R(0,6.28),
      col:[PAL.flower1,PAL.flower2,PAL.flower3][i%3],reT:0});
  }
  for(let i=0;i<14;i++){
    const tr=trees[RI(0,trees.length-1)];
    animals.push({kind:'ffly',x:tr?tr.x+R(-20,20):R(0,MW*16),
      y:tr?tr.y+R(-20,10):R(0,MH*16),a:R(0,6.28),ph:R(0,6.28),turnT:0});
  }
}
function flowerAnchors(){
  const out=[];
  for(const p of props)if(p.type==='flower'||p.type==='crop')out.push(p);
  for(const d of decor)if(d.t==='wf')out.push(d);
  return out;
}
let _anchors=null;
function updateAmbient(dt){
  const L=lightLevel(), night=isNight();
  /* ripples */
  for(let i=ripples.length-1;i>=0;i--){
    const r=ripples[i]; r.t+=dt;
    if(r.t>=r.life)ripples.splice(i,1);
  }
  /* frost patches */
  for(let i=frostPatches.length-1;i>=0;i--){
    const f=frostPatches[i]; f.t+=dt;
    if(f.t>=f.life)frostPatches.splice(i,1);
  }
  /* clouds drift */
  for(const c of clouds){
    c.x+=c.vx*dt;
    if(c.x-c.rx>MW*16)c.x=-c.rx;
  }
  /* bird flocks */
  flockT-=dt;
  if(flockT<=0 && L>0.7){
    flockT=R(16,34);
    const dir=rng()<0.5?1:-1;
    const fy=camY+R(20,60);
    const mem=[]; const n=RI(3,5);
    for(let i=0;i<n;i++)mem.push({ox:-i*7*dir+R(-3,3),oy:Math.abs(i-(n-1)/2)*4+R(-2,2)});
    flocks.push({x:dir>0?camX-30:camX+LW+30, y:fy, vx:dir*R(55,85), mem, t:0});
  }
  for(let i=flocks.length-1;i>=0;i--){
    const f=flocks[i]; f.x+=f.vx*dt; f.t+=dt;
    if(f.t>40)flocks.splice(i,1);
  }
  /* animals */
  for(const a of animals){
    if(a.kind==='fish'){
      a.turnT-=dt;
      if(a.turnT<=0){a.turnT=R(1,3);a.a+=R(-1.2,1.2);}
      const nx=a.x+Math.cos(a.a)*a.sp*dt, ny=a.y+Math.sin(a.a)*a.sp*dt;
      if(waterAt(Math.floor(nx/16),Math.floor(ny/16))){a.x=nx;a.y=ny;}
      else a.a+=Math.PI;
      if(a.jump>0){ a.jump-=dt; if(a.jump<=0)spawnRipple(a.x,a.y,7); }
      else { a.jT-=dt;
        if(a.jT<=0){ a.jT=R(7,18); a.jump=0.55; spawnRipple(a.x,a.y,6);
          for(let k=0;k<4;k++)particles.push({x:a.x,y:a.y,vx:R(-14,14),vy:R(-30,-14),
            t:R(0.25,0.45),col:PAL.foam,sz:1});
        }
      }
    }
    else if(a.kind==='duck'){
      a.turnT-=dt;
      if(a.turnT<=0){a.turnT=R(1.5,4);a.a=R(0,6.28);a.swim=rng()<0.7;}
      if(a.swim){
        const s=9;
        const nx=a.x+Math.cos(a.a)*s*dt, ny=a.y+Math.sin(a.a)*s*dt;
        if(waterAt(Math.floor(nx/16),Math.floor(ny/16))){
          a.x=nx;a.y=ny;a.face=Math.cos(a.a)>=0?1:-1;
          a.rippleT-=dt;
          if(a.rippleT<=0){a.rippleT=0.55;spawnRipple(a.x,a.y+2,5,0.8);}
        } else a.a+=Math.PI;
      }
    }
    else if(a.kind==='goose'){
      a.animT+=dt; if(a.animT>0.22){a.animT=0;a.frame=1-a.frame;}
      a.turnT-=dt;
      if(a.turnT<=0){a.turnT=R(1.5,4);a.a=R(0,6.28);a.walk=rng()<0.65;}
      if(a.walk){
        const s=13;
        const nx=a.x+Math.cos(a.a)*s*dt, ny=a.y+Math.sin(a.a)*s*dt;
        const tx=Math.floor(nx/16), ty=Math.floor(ny/16);
        if(inR(tx,ty,WALL.x0+1,WALL.y0+1,WALL.x1-1,WALL.y1-1)&&!solid[idx(tx,ty)]){
          a.x=nx;a.y=ny;a.face=Math.cos(a.a)>=0?1:-1;
        } else a.a+=Math.PI;
      }
      a.honkT-=dt;
      const pd=Math.hypot(player.x-a.x,player.y-a.y);
      if(pd<22&&a.honkT<=0){a.honkT=R(3,9);
        a.face=player.x>a.x?1:-1;
        beep(310,0.09,0.03,'square');beep(255,0.11,0.025,'square');}
    }
    else if(a.kind==='rabbit'){
      a.animT+=dt; if(a.animT>0.14){a.animT=0;a.frame=1-a.frame;}
      const pd=Math.hypot(player.x-a.x,player.y-a.y);
      if(pd<44){ a.flee=0.8; a.a=Math.atan2(a.y-player.y,a.x-player.x); }
      if(a.flee>0){
        a.flee-=dt;
        const s=85;
        const nx=a.x+Math.cos(a.a)*s*dt, ny=a.y+Math.sin(a.a)*s*dt;
        const tx=Math.floor(nx/16), ty=Math.floor(ny/16);
        if(inMap(tx,ty)&&!solid[idx(tx,ty)]&&ground[idx(tx,ty)]!==GID.water){
          a.x=nx;a.y=ny;a.face=Math.cos(a.a)>=0?1:-1;
        } else a.a+=R(1.2,2.0);
      } else {
        a.turnT-=dt;
        if(a.turnT<=0){a.turnT=R(1.5,5);a.a=R(0,6.28);a.hop=rng()<0.5;}
        if(a.hop){
          const s=16;
          const nx=a.x+Math.cos(a.a)*s*dt, ny=a.y+Math.sin(a.a)*s*dt;
          const tx=Math.floor(nx/16), ty=Math.floor(ny/16);
          if(inMap(tx,ty)&&!solid[idx(tx,ty)]&&ground[idx(tx,ty)]!==GID.water){
            a.x=nx;a.y=ny;a.face=Math.cos(a.a)>=0?1:-1;
          } else a.a+=Math.PI;
        }
      }
    }
    else if(a.kind==='bfly'){
      if(L<0.7)continue;
      a.t+=dt; a.reT-=dt;
      if(a.reT<=0||!a.anchored){
        a.reT=R(8,18);
        if(!_anchors)_anchors=flowerAnchors();
        if(_anchors.length){
          const an=_anchors[RI(0,_anchors.length-1)];
          a.ax=an.x; a.ay=an.y-4; a.anchored=true;
        }
      }
      a.x=a.ax+Math.sin(a.t*0.7+a.ph)*14;
      a.y=a.ay+Math.sin(a.t*1.3+a.ph*2)*7 - 5;
    }
    else if(a.kind==='ffly'){
      if(!night)continue;
      a.turnT-=dt;
      if(a.turnT<=0){a.turnT=R(0.5,1.5);a.a+=R(-1.5,1.5);}
      a.x+=Math.cos(a.a)*7*dt; a.y+=Math.sin(a.a)*7*dt;
    }
  }
}

/* ---------------- draw: decor, water detail, animals ------------------- */
function drawDecor(cx,cy){
  for(const d of decor){
    const x=Math.round(d.x-cx), y=Math.round(d.y-cy);
    if(x<-8||x>LW+8||y<-8||y>LH+8)continue;
    const sway=Math.round(Math.sin(waterPhase*1.2+d.seed)*1);
    if(d.t==='tuft'){
      g.fillStyle=PAL.grassC;
      g.fillRect(x+sway,y-3,1,3); g.fillRect(x+2,y-4,1,4); g.fillRect(x+4+sway,y-3,1,3);
      g.fillStyle='#6aa055'; g.fillRect(x+2,y-4,1,1);
    } else if(d.t==='pebble'){
      g.fillStyle='#8d8578'; g.fillRect(x,y,3,2);
      g.fillStyle='#a29a8c'; g.fillRect(x,y,2,1);
    } else if(d.t==='shroom'){
      g.fillStyle='#d8cbb0'; g.fillRect(x+1,y-2,1,2);
      g.fillStyle='#b8442f'; g.fillRect(x,y-4,3,2);
      g.fillStyle='#e8e2d0'; g.fillRect(x+1,y-4,1,1);
    } else if(d.t==='wf'){
      const cols=[PAL.flower1,PAL.flower2,PAL.flower3];
      g.fillStyle=PAL.grassC; g.fillRect(x+1,y-1,1,2);
      g.fillStyle=cols[d.seed%3]; g.fillRect(x,y-3,2,2);
      if(d.seed%2){g.fillStyle=cols[(d.seed+1)%3];g.fillRect(x+3,y-2,2,2);}
    } else if(d.t==='reed'){
      g.fillStyle=PAL.reed;
      g.fillRect(x+sway,y-6,1,6); g.fillRect(x+2,y-8,1,8); g.fillRect(x+4+sway,y-5,1,5);
      g.fillStyle=PAL.cattail; g.fillRect(x+2,y-8,1,3);
    } else if(d.t==='lily'){
      const bob=Math.round(Math.sin(waterPhase*0.9+d.seed)*1);
      g.fillStyle=PAL.lily;
      g.fillRect(x,y+bob,5,3); g.fillRect(x+1,y-1+bob,3,1);
      g.fillStyle=PAL.water; g.fillRect(x+4,y+bob,1,1);
      if(d.seed%4===0){g.fillStyle=PAL.lilyBloom;g.fillRect(x+1,y-1+bob,2,2);}
    }
  }
}
function drawWaterDetail(cx,cy,tx0,ty0,tx1,ty1){
  /* shallow tint + lapping foam on land-adjacent water */
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){
    if(ground[idx(tx,ty)]!==GID.water)continue;
    const px=tx*16-cx, py=ty*16-cy;
    const N=inMap(tx,ty-1)&&ground[idx(tx,ty-1)]!==GID.water;
    const S=inMap(tx,ty+1)&&ground[idx(tx,ty+1)]!==GID.water;
    const W=inMap(tx-1,ty)&&ground[idx(tx-1,ty)]!==GID.water;
    const E=inMap(tx+1,ty)&&ground[idx(tx+1,ty)]!==GID.water;
    if(!(N||S||W||E))continue;
    g.globalAlpha=0.18; g.fillStyle=PAL.shallow; g.fillRect(px,py,16,16);
    g.globalAlpha=0.55; g.fillStyle=PAL.foam;
    const lap=Math.sin(waterPhase*2+tx*1.3+ty*0.7)>0?1:0;
    if(N){g.fillRect(px+1+lap,py,4,1);g.fillRect(px+8-lap,py,5,1);}
    if(S){g.fillRect(px+2-lap,py+15,5,1);g.fillRect(px+10+lap,py+15,4,1);}
    if(W){g.fillRect(px,py+1+lap,1,4);g.fillRect(px,py+8-lap,1,5);}
    if(E){g.fillRect(px+15,py+2-lap,1,5);g.fillRect(px+15,py+10+lap,1,4);}
    g.globalAlpha=1;
  }
  /* ripples */
  for(const r of ripples){
    const k=r.t/r.life;
    g.save(); g.globalAlpha=(1-k)*0.5;
    g.strokeStyle=PAL.foam; g.lineWidth=1;
    g.beginPath(); g.arc(Math.round(r.x-cx),Math.round(r.y-cy),r.rMax*k+1,0,Math.PI*2);
    g.stroke(); g.restore();
  }
}
function drawFish(cx,cy){
  for(const a of animals){
    if(a.kind!=='fish')continue;
    const x=Math.round(a.x-cx), y=Math.round(a.y-cy);
    if(x<-10||x>LW+10||y<-10||y>LH+10)continue;
    if(a.jump>0){
      const k=1-a.jump/0.55;
      const yo=Math.round(-7*Math.sin(Math.PI*k));
      g.fillStyle=PAL.fishHi;
      g.fillRect(x-2,y+yo,4,2); g.fillRect(x+2,y+yo,1,1);
      g.fillStyle='#e8e2d0'; g.fillRect(x-2,y+yo,1,1);
    } else {
      g.save(); g.globalAlpha=0.45;
      g.fillStyle=PAL.fish;
      const fx=Math.cos(a.a)>=0?1:-1;
      g.fillRect(x-2,y,5,2); g.fillRect(x-2-fx,y,1,1); g.fillRect(x+3*fx-(fx<0?2:0),y+1,1,1);
      g.restore();
    }
  }
}
function drawFrostPatches(cx,cy){
  for(const f of frostPatches){
    const k=1-f.t/f.life;
    g.save(); g.globalAlpha=k*0.22;
    g.fillStyle=PAL.frost;
    g.beginPath(); g.arc(Math.round(f.x-cx),Math.round(f.y-cy),f.r,0,Math.PI*2); g.fill();
    g.globalAlpha=k*0.4;
    for(let i=0;i<5;i++){
      const a=i*1.256+f.x;
      g.fillRect(Math.round(f.x-cx+Math.cos(a)*f.r*0.6),
                 Math.round(f.y-cy+Math.sin(a)*f.r*0.6*0.5),2,2);
    }
    g.restore();
  }
}
function drawClouds(cx,cy){
  if(lightLevel()<0.85)return;
  g.save(); g.globalAlpha=0.07; g.fillStyle='#000';
  for(const c of clouds){
    const x=c.x-cx, y=c.y-cy;
    if(x+c.rx<0||x-c.rx>LW||y+c.ry<0||y-c.ry>LH)continue;
    g.beginPath(); g.ellipse(x,y,c.rx,c.ry,0,0,Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(x+c.rx*0.55,y+6,c.rx*0.6,c.ry*0.7,0,0,Math.PI*2); g.fill();
  }
  g.restore();
}
function drawAnimal(a,cx,cy){
  const x=Math.round(a.x-cx), y=Math.round(a.y-cy);
  if(x<-14||x>LW+14||y<-14||y>LH+14)return;
  if(a.kind==='duck'){
    const bob=Math.round(Math.sin(performance.now()/320+a.ph)*1);
    g.save(); g.translate(x,y+bob);
    if(a.face<0)g.scale(-1,1);
    g.fillStyle=PAL.duckBody; g.fillRect(-4,-4,8,4);
    g.fillStyle=PAL.duckWing; g.fillRect(-3,-3,4,2);
    g.fillStyle=PAL.duckHead; g.fillRect(2,-7,3,4);
    g.fillStyle=PAL.bill; g.fillRect(5,-6,2,1);
    g.fillStyle='#000'; g.fillRect(3,-6,1,1);
    g.restore();
  } else if(a.kind==='goose'){
    g.save(); g.translate(x,y);
    if(a.face<0)g.scale(-1,1);
    g.fillStyle='#e0a030';
    g.fillRect(-2+(a.frame?1:0),-1,1,2); g.fillRect(1-(a.frame?1:0),-1,1,2);
    g.fillStyle=PAL.goose; g.fillRect(-4,-6,8,5);
    g.fillStyle=PAL.gooseD; g.fillRect(-4,-3,4,2);
    g.fillStyle=PAL.goose; g.fillRect(3,-11,2,6);
    g.fillRect(3,-12,3,3);
    g.fillStyle=PAL.bill; g.fillRect(6,-11,2,1);
    g.fillStyle='#000'; g.fillRect(4,-11,1,1);
    g.restore();
  } else if(a.kind==='rabbit'){
    g.save(); g.translate(x,y);
    if(a.face<0)g.scale(-1,1);
    const hop=(a.flee>0||a.hop)&&a.frame?-1:0;
    g.fillStyle=PAL.rabbit; g.fillRect(-3,-4+hop,6,4);
    g.fillStyle=PAL.rabbitD; g.fillRect(-3,-2+hop,2,2);
    g.fillStyle=PAL.rabbit; g.fillRect(2,-6+hop,2,3);
    g.fillRect(2,-8+hop,1,2);
    g.fillStyle='#e8e2d0'; g.fillRect(-4,-3+hop,1,1);
    g.fillStyle='#000'; g.fillRect(3,-5+hop,1,1);
    g.restore();
  }
}
function drawBflies(cx,cy){
  const t=performance.now()/60;
  for(const a of animals){
    if(a.kind!=='bfly'||lightLevel()<0.7||!a.anchored)continue;
    const x=Math.round(a.x-cx), y=Math.round(a.y-cy);
    if(x<-6||x>LW+6||y<-6||y>LH+6)continue;
    g.fillStyle=a.col;
    if(Math.floor(t+a.ph*3)%2){ g.fillRect(x-2,y,2,1); g.fillRect(x+1,y,2,1); }
    else { g.fillRect(x-1,y-1,1,2); g.fillRect(x+1,y-1,1,2); }
  }
}
function drawFlocks(cx,cy){
  g.fillStyle=PAL.bird;
  const f2=Math.floor(performance.now()/140)%2;
  for(const f of flocks){
    for(const m of f.mem){
      const x=Math.round(f.x+m.ox-cx), y=Math.round(f.y+m.oy-cy);
      if(x<-8||x>LW+8||y<-8||y>LH+8)continue;
      if(f2){ g.fillRect(x-2,y-1,2,1); g.fillRect(x+1,y-1,2,1); g.fillRect(x,y,1,1); }
      else  { g.fillRect(x-2,y,2,1);  g.fillRect(x+1,y,2,1);  g.fillRect(x,y,1,1); }
      g.save(); g.globalAlpha=0.12; g.fillStyle='#000';
      g.fillRect(x-1,y+26,4,2); g.restore(); g.fillStyle=PAL.bird;
    }
  }
}


let waterPhase=0;
function render(dt){
  waterPhase+=dt;
  const cx = Math.round(camX), cy = Math.round(camY);
  g.fillStyle='#0a0c10'; g.fillRect(0,0,LW,LH);

  const tx0=Math.max(0,Math.floor(cx/16)), ty0=Math.max(0,Math.floor(cy/16));
  const tx1=Math.min(MW-1,tx0+Math.ceil(LW/16)+1), ty1=Math.min(MH-1,ty0+Math.ceil(LH/16)+1);

  /* ground */
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++)
    g.drawImage(T[GT[ground[idx(tx,ty)]]], tx*16-cx, ty*16-cy);

  drawFish(cx,cy);

  /* water caustics */
  g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=0.12;
  g.fillStyle=PAL.waterLit;
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){
    if(ground[idx(tx,ty)]!==GID.water)continue;
    const px=tx*16-cx, py=ty*16-cy;
    const o1=Math.floor((Math.sin(waterPhase*1.1+tx*0.9+ty*0.6)+1)*6);
    const o2=Math.floor((Math.sin(waterPhase*0.7-tx*0.5+ty*1.1)+1)*6);
    g.fillRect(px+o1%14, py+4, 3, 1);
    g.fillRect(px+o2%13, py+11, 4, 1);
  }
  g.restore();

  drawWaterDetail(cx,cy,tx0,ty0,tx1,ty1);
  drawDecor(cx,cy);
  drawFrostPatches(cx,cy);
  drawClouds(cx,cy);

  /* verge stone rail: light lip on verge tiles that touch the moat */
  g.fillStyle=PAL.stoneL;
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){
    if(!(flags[idx(tx,ty)]&16))continue;
    const px=tx*16-cx, py=ty*16-cy;
    if(inMap(tx,ty-1)&&ground[idx(tx,ty-1)]===GID.water)g.fillRect(px,py,16,2);
    if(inMap(tx,ty+1)&&ground[idx(tx,ty+1)]===GID.water)g.fillRect(px,py+14,16,2);
    if(inMap(tx-1,ty)&&ground[idx(tx-1,ty)]===GID.water)g.fillRect(px,py,2,16);
    if(inMap(tx+1,ty)&&ground[idx(tx+1,ty)]===GID.water)g.fillRect(px+2-2,py,2,16);
  }

  /* shadows (blob; directional lands in P4) */
  g.save(); g.globalAlpha=0.28*lightLevel(); g.fillStyle='#000';
  function blob(x,y,w){ g.beginPath();
    g.ellipse(Math.round(x-cx),Math.round(y-cy),w,Math.max(2,w*0.45),0,0,Math.PI*2);
    g.fill(); }
  blob(player.x,player.y+1,6);
  for(const w of wolves)if(w.hp>0)blob(w.x,w.y+1,7);
  for(const s of spectators)blob(s.x,s.y+1,7);
  for(const t of trees)blob(t.x,t.y-1,7);
  for(const r of rocks)blob(r.x,r.y-1,r.big?7:5);
  for(const n of npcs)blob(n.x,n.y+1,5);
  g.restore();

  /* y-sorted entities & props */
  const draws=[];
  for(const wt of wallTiles){
    if(wt.tx<tx0-1||wt.tx>tx1+1||wt.ty<ty0-1||wt.ty>ty1+2)continue;
    draws.push({y:(wt.ty+1)*16, fn:()=>drawWallTile(wt,cx,cy)});
  }
  for(const b of buildings)
    draws.push({y:(b.ty+b.th)*16, fn:()=>drawBuilding(b,cx,cy)});
  for(const p of props) draws.push({y:p.y, fn:()=>drawProp(p,cx,cy)});
  for(const c of cliffs){
    if(c.tx<tx0-1||c.tx>tx1+1||c.ty<ty0-1||c.ty>ty1+2)continue;
    draws.push({y:(c.ty+1)*16, fn:()=>drawCliff(c,cx,cy)});
  }
  for(const r of rocks){
    if(r.x<cx-24||r.x>cx+LW+24||r.y<cy-32||r.y>cy+LH+32)continue;
    draws.push({y:r.y, fn:()=>drawRock(r,cx,cy)});
  }
  for(const t of trees) draws.push({y:t.y, fn:()=>drawTree(t,cx,cy)});
  for(const w of wolves) draws.push({y:w.y, fn:()=>drawWolf(w,cx,cy)});
  for(const a of animals){
    if(a.kind==='duck'||a.kind==='goose'||a.kind==='rabbit')
      draws.push({y:a.y, fn:()=>drawAnimal(a,cx,cy)});
  }
  for(const s of spectators) draws.push({y:s.y, fn:()=>drawSpectator(s,cx,cy)});
  for(const n of npcs) draws.push({y:n.y, fn:()=>drawNpc(n,cx,cy)});
  draws.push({y:player.y, fn:()=>drawPlayer(cx,cy)});
  draws.sort((a,b)=>a.y-b.y);
  for(const d of draws)d.fn();

  /* projectiles / novas / coins / particles */
  g.fillStyle='#d8d2c4';
  for(const p of projectiles)
    g.fillRect(Math.round(p.x-cx)-1,Math.round(p.y-cy)-1,2,2);
  for(const n of novas){
    g.save(); g.globalAlpha=Math.max(0,1-n.t/0.45);
    g.strokeStyle=PAL.frost; g.lineWidth=2;
    g.beginPath(); g.arc(Math.round(n.x-cx),Math.round(n.y-cy),n.r,0,Math.PI*2); g.stroke();
    g.globalAlpha*=0.3; g.fillStyle=PAL.frost;
    g.beginPath(); g.arc(Math.round(n.x-cx),Math.round(n.y-cy),n.r,0,Math.PI*2); g.fill();
    g.restore();
  }
  for(const c of coins){
    g.fillStyle=PAL.coinDark;
    g.fillRect(Math.round(c.x-cx)-2,Math.round(c.y-cy)-2,4,4);
    g.fillStyle=PAL.coin;
    g.fillRect(Math.round(c.x-cx)-1,Math.round(c.y-cy)-2,2,3);
    if((performance.now()/120 + c.x)%7 < 0.6){
      g.fillStyle='#fff';
      g.fillRect(Math.round(c.x-cx)-2,Math.round(c.y-cy)-3,1,1);
    }
  }
  for(const p of particles){
    g.globalAlpha=Math.min(1,p.t*2);
    g.fillStyle=p.col;
    g.fillRect(Math.round(p.x-cx),Math.round(p.y-cy),p.sz||1,p.sz||1);
    g.globalAlpha=1;
  }
  for(const sp of sparks){                     // impact star at the point of contact
    const k=sp.t/sp.life, r=1+k*5;
    const sx=Math.round(sp.x-cx), sy=Math.round(sp.y-cy);
    g.save(); g.globalAlpha=Math.max(0,1-k);
    g.fillStyle='#fff4d0';
    g.fillRect(sx-r,sy,r*2,1); g.fillRect(sx,sy-r,1,r*2);
    const d=Math.round(r*0.62);
    g.fillStyle='#ffd08a';
    g.fillRect(sx-d,sy-d,1,1); g.fillRect(sx+d,sy-d,1,1);
    g.fillRect(sx-d,sy+d,1,1); g.fillRect(sx+d,sy+d,1,1);
    if(k<0.4){ g.fillStyle='#ffffff'; g.fillRect(sx-1,sy-1,2,2); }
    g.restore();
  }

  drawBflies(cx,cy);
  drawFlocks(cx,cy);

  /* day/night ambient tint */
  if(region.interior){
    g.fillStyle='rgba(30,18,10,0.30)'; g.fillRect(0,0,LW,LH);
    g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=0.16;
    for(const lp of lamps){
      const gx=Math.round(lp.x-cx), gy=Math.round(lp.y-cy);
      g.fillStyle='#ffd98a';
      g.beginPath(); g.arc(gx,gy,42,0,Math.PI*2); g.fill();
    }
    g.restore();
  }
  const L = region.interior?1:lightLevel();
  if(L<0.99){
    g.fillStyle='rgba(12,18,46,'+((1-L)*0.62).toFixed(3)+')';
    g.fillRect(0,0,LW,LH);
  }
  if(region.depth>0){
    g.fillStyle='rgba(18,12,24,'+Math.min(0.30,0.065*region.depth).toFixed(3)+')';
    g.fillRect(0,0,LW,LH);
  }

  /* night lights: lamps, windows, glints — punched over the dark */
  g.save(); g.globalCompositeOperation='lighter';
  const lampOn = L<0.85;
  for(const l of lamps){
    const lx=l.x-cx, ly=l.y-cy;
    if(lx<-30||lx>LW+30||ly<-30||ly>LH+30)continue;
    if(lampOn){
      const flick = 1+Math.sin(performance.now()/250+l.x)*0.06;
      const grd=g.createRadialGradient(lx,ly-8,2,lx,ly-8,24*flick);
      grd.addColorStop(0,'rgba(255,214,140,0.30)');
      grd.addColorStop(1,'rgba(255,214,140,0)');
      g.fillStyle=grd; g.fillRect(lx-26,ly-34,52,52);
    }
    g.globalCompositeOperation='source-over';
    g.fillStyle='#3a2f1e'; g.fillRect(lx-1,ly-9,2,10);
    g.fillStyle=lampOn?PAL.win:'#6a5a3a'; g.fillRect(lx-2,ly-12,4,4);
    g.globalCompositeOperation='lighter';
  }
  if(isNight()){
    /* treeline eye glints — the horde beyond the horde */
    for(const gl of glints){
      const gx=gl.x-cx, gy=gl.y-cy;
      if(gx<-4||gx>LW+4||gy<-4||gy>LH+4)continue;
      const blink=(Math.sin(performance.now()/1000*gl.sp+gl.ph)+1)/2;
      if(blink<0.35)continue;
      g.globalAlpha=blink*0.9;
      g.fillStyle=PAL.wolfEye;
      g.fillRect(Math.round(gx),Math.round(gy),1,1);
      g.fillRect(Math.round(gx)+2,Math.round(gy),1,1);
    }
    g.globalAlpha=1;
    /* fireflies */
    for(const a of animals){
      if(a.kind!=='ffly')continue;
      const fx=a.x-cx, fy=a.y-cy;
      if(fx<-6||fx>LW+6||fy<-6||fy>LH+6)continue;
      const bl=(Math.sin(performance.now()/700+a.ph)+1)/2;
      if(bl<0.3)continue;
      g.globalAlpha=bl*0.5;
      g.fillStyle=PAL.firefly;
      g.fillRect(Math.round(fx)-1,Math.round(fy)-1,3,3);
      g.globalAlpha=bl;
      g.fillRect(Math.round(fx),Math.round(fy),1,1);
    }
    g.globalAlpha=1;
  }
  g.restore();

  drawHUD();
  drawTouch();

  if(fade){
    const a = fade.phase==='out'?Math.min(1,fade.t/0.32):Math.max(0,1-fade.t/0.32);
    g.fillStyle='rgba(0,0,0,'+a.toFixed(3)+')'; g.fillRect(0,0,LW,LH);
  }

  sc.fillStyle='#000'; sc.fillRect(0,0,cv.width,cv.height);
  sc.drawImage(logical,0,0,LW,LH,OX,OY,LW*SCALE,LH*SCALE);
}

/* ---------------- draw: wall, buildings, props ------------------------ */
function drawCliff(c,cx,cy){
  const x=c.tx*16-cx, y=c.ty*16-cy, s=c.seed;
  g.fillStyle=PAL.rockD; g.fillRect(x,y+1,16,15);
  g.fillStyle=PAL.rock;  g.fillRect(x,y-11,16,13);
  g.fillStyle=PAL.rockL; g.fillRect(x,y-11,16,2);
  g.fillStyle=PAL.rockL; g.fillRect(x+(s*3)%10, y-15, 4, 4);
  g.fillRect(x+(s*7)%12, y-14, 3, 3);
  g.fillStyle=PAL.rockD;
  g.fillRect(x+2+(s*5)%9, y-7, 3, 6);
  g.fillRect(x+((s*13)%13), y-3, 2, 4);
  if(s%3===0){ g.fillStyle=PAL.rockMoss; g.fillRect(x+(s*11)%11, y-12, 5, 2); }
}
function drawRock(r,cx,cy){
  const x=Math.round(r.x-cx), y=Math.round(r.y-cy), s=r.seed;
  const w=r.big?15:10, h=r.big?12:7, lx=x-(w>>1);
  g.fillStyle=PAL.rockD; g.fillRect(lx,y-h,w,h);
  g.fillStyle=PAL.rock;  g.fillRect(lx+1,y-h+1,w-2,h-2);
  g.fillStyle=PAL.rockL; g.fillRect(lx+1,y-h+1,w-3,2);
  g.fillStyle=PAL.rockD; g.fillRect(lx+2+(s%4),y-h+4,2,2);
  if(s%4===0){ g.fillStyle=PAL.rockMoss; g.fillRect(lx+2,y-3,w-5,2); }
}

function drawWallTile(wt,cx,cy){
  const x=wt.tx*16-cx, y=wt.ty*16-cy;
  if(wt.palisade){
    g.fillStyle=PAL.palisD; g.fillRect(x,y+4,16,12);
    for(let i=0;i<4;i++){
      const px=x+i*4, h=17+((wt.tx*7+wt.ty*5+i)%4);
      g.fillStyle=PAL.palis;   g.fillRect(px,y+6-h+6,4,h);
      g.fillStyle=PAL.palisTip;g.fillRect(px,y+6-h+6,4,2);
      g.fillStyle=PAL.palisD;  g.fillRect(px+3,y+6-h+8,1,h-4);
    }
    g.fillStyle=PAL.woodD; g.fillRect(x,y-2,16,2);
    return;
  }
  if(wt.inner){
    if(wt.gap) return;
    g.fillStyle=PAL.wainscot; g.fillRect(x,y+2,16,14);
    g.fillStyle=PAL.plasterI; g.fillRect(x,y-9,16,11);
    g.fillStyle=PAL.beam;     g.fillRect(x,y-11,16,3);
    g.fillStyle=PAL.woodD;    g.fillRect(x,y+1,16,2);
    g.fillStyle=PAL.beam;     g.fillRect(x+7,y-9,2,11);
    return;
  }
  if(wt.ruin){
    const h=6+(wt.tx*7+wt.ty*13)%7;
    g.fillStyle=PAL.stoneD; g.fillRect(x,y+2,16,14);
    g.fillStyle=PAL.ruin;   g.fillRect(x,y+2-h,16,h+1);
    g.fillStyle=PAL.stoneD; g.fillRect(x,y+2-h,16,1);
    g.fillStyle=PAL.rockMoss; g.fillRect(x+((wt.tx*5)%11),y+1,4,2);
    return;
  }
  g.fillStyle=PAL.stoneD; g.fillRect(x,y+2,16,14);          // base
  g.fillStyle=PAL.stone;  g.fillRect(x,y-8,16,10);          // face
  g.fillStyle=PAL.stoneD;
  g.fillRect(x,y-3,16,1); g.fillRect(x+5,y-8,1,5); g.fillRect(x+11,y-3,1,5);
  g.fillStyle=PAL.stoneL; g.fillRect(x,y-10,16,2);          // cap
  if((wt.tx+wt.ty)%2===0){                                   // merlons
    g.fillRect(x+2,y-13,4,3); g.fillRect(x+10,y-13,4,3);
  }
}

function drawBuilding(b,cx,cy){
  const x=b.tx*16-cx, y=b.ty*16-cy, w=b.tw*16, h=b.th*16;
  const wallH=15, wy=y+h-wallH;
  const lit = lightLevel()<0.85;

  /* walls */
  if(b.wall==='timber'){
    g.fillStyle=PAL.plaster; g.fillRect(x,wy,w,wallH);
    g.fillStyle=PAL.beam;
    g.fillRect(x,wy,w,2); g.fillRect(x,y+h-2,w,2);
    for(let bx=0;bx<=w-2;bx+=Math.max(10,Math.floor(w/b.tw)))
      g.fillRect(x+bx,wy,2,wallH);
    g.fillRect(x+w-2,wy,2,wallH);
    /* one diagonal brace for character */
    for(let i=0;i<6;i++)g.fillRect(x+3+i,wy+3+i,2,1);
  } else {
    for(let i=0;i<b.tw;i++){
      g.fillStyle=PAL.stone; g.fillRect(x+i*16,wy,16,wallH);
      g.fillStyle=PAL.stoneD;
      g.fillRect(x+i*16,wy+5,16,1); g.fillRect(x+i*16,wy+11,16,1);
      g.fillRect(x+i*16+6,wy,1,5); g.fillRect(x+i*16+11,wy+6,1,5);
    }
  }

  /* windows: frame + shutter, glow at night */
  g.fillStyle=PAL.beam;
  const winY=wy+3;
  function win(wxp){
    g.fillStyle=PAL.beam; g.fillRect(wxp-1,winY-1,7,7);
    g.fillStyle=lit?PAL.win:PAL.winDay; g.fillRect(wxp,winY,5,5);
    g.fillStyle=PAL.beam; g.fillRect(wxp+2,winY,1,5);
  }
  if(b.tw>=4){ win(x+5); win(x+w-11); }
  if(b.tw>=6) win(x+Math.floor(w/2)+8);

  /* door with step + arch */
  const dx=b.door*16-cx;
  g.fillStyle=PAL.beam;  g.fillRect(dx+3,wy+1,10,wallH-1);
  g.fillStyle=PAL.door;  g.fillRect(dx+4,wy+2,8,wallH-2);
  g.fillStyle='#c9992a'; g.fillRect(dx+10,wy+8,1,2);        // handle
  g.fillStyle=PAL.stoneL;g.fillRect(dx+3,y+h-1,10,2);       // step

  /* roof by style, slight overhang */
  const ry0=y-10, ry1=wy-2, rh=ry1-ry0;
  const rx=x-2, rw=w+4;
  if(b.roof==='thatch'){
    g.fillStyle=PAL.thatch; g.fillRect(rx,ry0,rw,rh);
    g.fillStyle=PAL.thatchD;
    for(let ry=ry0+3;ry<ry1;ry+=4)
      for(let bx=rx+((ry/4)%2?3:0);bx<rx+rw-3;bx+=7) g.fillRect(bx,ry,4,1);
    /* ragged bottom edge */
    for(let bx=rx;bx<rx+rw;bx+=3) g.fillRect(bx,ry1-1+((bx/3)%2),3,2);
    g.fillStyle=PAL.thatchR; g.fillRect(rx,ry0,rw,3);
    g.fillStyle='#e0c070'; g.fillRect(rx,ry0+3,rw,1);
  } else if(b.roof==='slate'){
    g.fillStyle=PAL.slate; g.fillRect(rx,ry0,rw,rh);
    g.fillStyle=PAL.slateD;
    for(let ry=ry0+3;ry<ry1;ry+=4) g.fillRect(rx,ry,rw,1);
    g.fillStyle='#77879b';
    for(let ry=ry0+3;ry<ry1;ry+=4)
      for(let bx=rx+((ry/4)%2?4:0);bx<rx+rw-2;bx+=8) g.fillRect(bx,ry-1,3,1);
    g.fillStyle=PAL.slateR; g.fillRect(rx,ry0,rw,2);
    g.fillRect(rx,ry1-1,rw,2);
  } else { /* shingle */
    g.fillStyle=PAL.shingle; g.fillRect(rx,ry0,rw,rh);
    g.fillStyle=PAL.shingleD;
    for(let ry=ry0+3;ry<ry1;ry+=5) g.fillRect(rx,ry,rw,2);
    g.fillStyle=PAL.shingleR; g.fillRect(rx,ry0,rw,2);
    g.fillRect(rx,ry1-1,rw,2);
  }

  /* chimney */
  if(b.chim){
    const chx=x+w-14, chy=y-16;
    g.fillStyle=PAL.stoneD; g.fillRect(chx,chy,6,12);
    g.fillStyle=PAL.stone;  g.fillRect(chx+1,chy+1,4,10);
    g.fillStyle=PAL.stoneL; g.fillRect(chx-1,chy,8,2);
  }

  /* hanging shingle, with a glyph for the trade */
  if(b.sign){
    const sx=dx+16, sy=wy-4;
    g.fillStyle=PAL.beam; g.fillRect(sx,sy,1,4); g.fillRect(sx-4,sy,9,1);
    g.fillStyle=PAL.signWoodD; g.fillRect(sx-4,sy+4,9,7);
    g.fillStyle='#e0c070'; g.fillRect(sx-3,sy+5,7,5);
    const k=b.kind;
    if(k==='tavern'){ g.fillStyle='#8c4626'; g.fillRect(sx-1,sy+6,3,3); g.fillRect(sx+2,sy+7,1,1); }
    else if(k==='smithy'){ g.fillStyle=PAL.iron; g.fillRect(sx-2,sy+7,5,2); g.fillRect(sx+1,sy+6,2,1); }
    else if(k==='store'){ g.fillStyle='#6b543a'; g.fillRect(sx-2,sy+6,5,4);
      g.fillStyle='#c9992a'; g.fillRect(sx-2,sy+6,5,1); }
    else if(k==='stable'){ g.fillStyle='#5a4028'; g.fillRect(sx-2,sy+7,5,2); g.fillRect(sx-2,sy+6,2,1); }
    else { g.fillStyle='#9aa8c0'; g.fillRect(sx-1,sy+6,2,4); g.fillRect(sx-2,sy+7,4,1); }
  }
  /* the doorstep glows when you can walk in, and names itself */
  const dr = doors.find(dd=>dd.b===b);
  if(dr){
    const dpx=dr.tx*16+8, dpy=dr.ty*16+8;
    const dist=Math.hypot(dpx-player.x, dpy-player.y);
    if(dist<40){
      const a=Math.min(1,(40-dist)/16);
      g.save(); g.globalAlpha=a*(0.35+0.25*Math.sin(performance.now()/220));
      g.fillStyle='#ffd98a';
      g.fillRect(dr.tx*16-cx+3, dr.ty*16-cy+4, 10, 9);
      g.restore();
      if(b.name){
        g.save(); g.globalAlpha=a;
        g.font='7px monospace'; g.textBaseline='top';
        const tw2=g.measureText(b.name).width;
        const bx2=dpx-cx-tw2/2-3, by2=b.ty*16-cy-22;
        g.fillStyle='rgba(0,0,0,0.62)'; g.fillRect(bx2,by2,tw2+6,10);
        g.fillStyle=PAL.hud; g.fillText(b.name,bx2+3,by2+2);
        g.restore();
      }
    }
  }
}

  } else if(p.type==='woodpile'){
    for(let r=0;r<3;r++)for(let i=0;i<4;i++){

  } else if(p.type==='trough'){
    g.fillStyle=PAL.woodD; g.fillRect(x-9,y-7,18,7);
    g.fillStyle=PAL.wood;  g.fillRect(x-8,y-6,16,5);
    g.fillStyle=PAL.water; g.fillRect(x-7,y-5,14,3);

    g.fillStyle=PAL.woodD; g.fillRect(x-8,y-10,16,10);
    g.fillStyle=PAL.wood;  g.fillRect(x-8,y-12,16,3);

    g.fillStyle=PAL.woodD; g.fillRect(x-7,y-11,14,1); g.fillRect(x-7,y-6,14,1);

    g.fillStyle=PAL.woodD; g.fillRect(x-7,y-14,14,14);
    g.fillStyle=PAL.cloth; g.fillRect(x-6,y-11,12,10);
    g.fillStyle=PAL.clothD;g.fillRect(x-6,y-6,12,1);
    g.fillStyle='#e8e2d0'; g.fillRect(x-5,y-13,10,3);

  } else if(p.type==='sign'){
    g.fillStyle=PAL.signWoodD; g.fillRect(x-1,y-14,3,14);

    else if(d==='W'){ g.fillRect(x-3,y-19,6,2); g.fillRect(x-3,y-21,1,6); g.fillRect(x-2,y-20,1,4); }
    else { g.fillRect(x-3,y-19,6,2); g.fillRect(x+2,y-21,1,6); g.fillRect(x+1,y-20,1,4); }
    const dist=Math.hypot(p.x-player.x,p.y-player.y);
    if(dist<52 && p.label){
      g.save(); g.globalAlpha=Math.min(1,(52-dist)/18);
      g.font='7px monospace'; g.textBaseline='top';

      }
      g.restore();
    }
  } else if(p.type==='campfire'){
    g.fillStyle=PAL.ash; g.fillRect(x-6,y-4,12,4);
    g.fillStyle=PAL.rock;
    for(let i=0;i<5;i++)g.fillRect(x-7+i*3,y-5,3,3);
    g.fillStyle=PAL.beam; g.fillRect(x-5,y-7,10,2); g.fillRect(x-2,y-9,3,4);
    const t=performance.now()/90+p.seed;
    const fh=4+Math.round(Math.sin(t)*2);
    g.fillStyle='#e0642a'; g.fillRect(x-3,y-8-fh,6,fh);
    g.fillStyle=PAL.ember; g.fillRect(x-2,y-7-fh,4,fh);
    g.fillStyle='#ffd98a'; g.fillRect(x-1,y-6-fh,2,Math.max(1,fh-2));
    g.save(); g.globalAlpha=0.22; g.fillStyle=PAL.ember;
    g.fillRect(x-12,y-16,24,20); g.restore();
  } else if(p.type==='rubble'){
    g.fillStyle=PAL.stoneD;
    for(let i=0;i<4;i++)g.fillRect(x-6+((p.seed*(i+3))%12),y-4-((p.seed*i)%3),4,3);
    g.fillStyle=PAL.ruin;
    for(let i=0;i<3;i++)g.fillRect(x-5+((p.seed*(i+5))%10),y-3-((p.seed*i)%2),3,2);
  } else if(p.type==='flower'){
    const cols=[PAL.flower1,PAL.flower2,PAL.flower3];
    for(let i=0;i<4;i++){
      g.fillStyle=cols[(p.seed+i)%3];
      g.fillRect(x-5+((p.seed*7+i*5)%10), y-2-((p.seed+i*3)%4), 2,2);
    }
    g.fillStyle=PAL.grassC; g.fillRect(x-4,y-1,8,1);
  }
}

function drawTree(t,cx,cy){
  const x=Math.round(t.x-cx), y=Math.round(t.y-cy);
  const sway=Math.round(Math.sin(waterPhase*0.8 + t.x*0.05)*1);
  if(t.kind===1){                 /* pine */
    g.fillStyle=PAL.treeTrunk; g.fillRect(x-1,y-8,3,8);
    g.fillStyle=PAL.pine;
    g.fillRect(x-7,y-14,14,6);
    g.fillRect(x-5,y-20,10,7);
    g.fillRect(x-3+sway,y-26,6,7);
    g.fillStyle=PAL.pineD;
    g.fillRect(x-7,y-9,14,1); g.fillRect(x-5,y-14,10,1); g.fillRect(x-3+sway,y-20,6,1);
  } else if(t.kind===2){          /* birch */
    g.fillStyle=PAL.birch; g.fillRect(x-1,y-12,3,12);
    g.fillStyle=PAL.birchD;
    g.fillRect(x-1,y-4,2,1); g.fillRect(x,y-8,2,1); g.fillRect(x-1,y-11,1,1);
    g.fillStyle='#5c8a48';
    g.fillRect(x-6+sway,y-21,12,10);
    g.fillStyle='#6da257';
    g.fillRect(x-4+sway,y-24,8,5);
    g.fillRect(x-7+sway,y-16,3,4);
  } else if(t.kind===3){          /* dead */
    g.fillStyle=PAL.dead;
    g.fillRect(x-1,y-16,3,16);
    g.fillRect(x-6,y-13,6,2); g.fillRect(x-6,y-16,2,3);
    g.fillRect(x+2,y-18,5,2);  g.fillRect(x+5,y-21,2,4);
    g.fillRect(x-1,y-19,2,3);
  } else {                        /* oak */
    g.fillStyle=PAL.treeTrunk; g.fillRect(x-2,y-10,4,10);
    const s=t.seed;
    g.fillStyle=PAL.treeLeafA;
    g.fillRect(x-7+sway,y-24+(s%2),14,13);
    g.fillStyle=PAL.treeLeafB;
    g.fillRect(x-5+sway,y-27,10,6);
    g.fillRect(x-8+sway,y-18,4,5);
    g.fillRect(x+4+sway,y-16,4,4);
  }
}

function drawWolf(w,cx,cy){
  const x=Math.round(w.x-cx), y=Math.round(w.y-cy);
  const dying = w.hp<=0;
  g.save();
  g.translate(x,y);
  if(dying){
    const k=Math.min(1,w.deadT/0.40);              // body collapses to the ground
    const f=Math.max(0,Math.min(1,(w.deadT-0.55)/0.65));
    g.globalAlpha=1-f;
    g.translate(0,Math.round(k*4));
    g.scale(1+k*0.30, 1-k*0.66);
  }
  if(w.face<0)g.scale(-1,1);
  if(!dying && w.hitT>0){                          // impact squash
    const q=Math.min(1,w.hitT/0.09);
    g.scale(1+q*0.16, 1-q*0.13);
  }
  g.drawImage(WOLF_SPR[w.frame],-9,-11);
  if(dying){
    const a0=g.globalAlpha;
    g.globalAlpha=a0*Math.min(0.62,0.25+w.deadT*1.4);
    g.drawImage(tintOf(WOLF_SPR[w.frame],'#2a2620'),-9,-11);
    g.globalAlpha=a0;
  } else if(w.flashT>0){                           // brief warm rim, never a white-out
    g.globalAlpha*=Math.min(0.38,w.flashT*4.2);
    g.drawImage(tintOf(WOLF_SPR[w.frame],'#ffc0a0'),-9,-11);
  }
  g.restore();
  if(w.chill>0){
    g.fillStyle=PAL.frost;
    g.fillRect(x-6,y-13,2,2); g.fillRect(x+4,y-14,2,2); g.fillRect(x-1,y-15,2,2);
  }
  if(w.hp>0&&w.hp<w.hpMax){
    g.fillStyle='#000'; g.fillRect(x-7,y-16,14,2);
    g.fillStyle=PAL.hp; g.fillRect(x-7,y-16,Math.round(14*w.hp/w.hpMax),2);
  }
}
function drawNpc(n,cx,cy){
  const x=Math.round(n.x-cx), y=Math.round(n.y-cy);
  if(x<-20||x>LW+20||y<-28||y>LH+28)return;
  const spr=n.spr[n.dir][n.moving?n.frame:0];
  g.drawImage(spr, x-8, y-19);
  const dist=Math.hypot(n.x-player.x, n.y-player.y);
  if(dist<34){
    const a=Math.min(1,(34-dist)/12);
    g.save(); g.globalAlpha=a;
    g.font='7px monospace'; g.textBaseline='top';
    const nw=g.measureText(n.name).width;
    g.fillStyle='rgba(0,0,0,0.55)'; g.fillRect(x-nw/2-3,y-31,nw+6,10);
    g.fillStyle=PAL.hudDim; g.fillText(n.name,x-nw/2,y-29);
    const lw2=Math.min(LW-8, g.measureText(n.line).width);
    let lx=x-lw2/2-4;
    lx=Math.max(2,Math.min(LW-lw2-10,lx));
    g.fillStyle='rgba(0,0,0,0.7)'; g.fillRect(lx,y-43,lw2+8,11);
    g.fillStyle=BRANCHES.N.tint; g.fillRect(lx,y-43,lw2+8,1);
    g.fillStyle=PAL.hud; g.fillText(n.line,lx+4,y-41);
    g.restore();
  }
}
function drawSpectator(s,cx,cy){
  const x=Math.round(s.x-cx), y=Math.round(s.y-cy);
  if(x<-12||x>LW+12||y<-12||y>LH+12)return;
  g.save(); g.globalAlpha=0.9;
  g.translate(x,y);
  if(s.face<0)g.scale(-1,1);
  g.drawImage(WOLF_SPR[s.frame],-9,-11);
  g.restore();
}

function drawPlayer(cx,cy){
  const x=Math.round(player.x-cx), y=Math.round(player.y-cy);
  const spr=player.spr[player.dir][player.moving?player.frame:0];
  if(player.iframes>0 && Math.floor(performance.now()/60)%2)return;
  g.drawImage(spr, x-8, y-19);
  if(player.flashT>0){
    g.save(); g.globalAlpha=Math.min(0.55,player.flashT*4);
    g.drawImage(tintOf(spr,'#ff6a4a'), x-8, y-19);
    g.restore();
  }
  if(flowT>=B.FLOW_TIERS[0][0]){
    let col=PAL.aether;
    if(flowT>=35)col=PAL.flow4; else if(flowT>=20)col=PAL.flow3;
    else if(flowT>=10)col=PAL.flow2;
    g.save(); g.globalAlpha=0.5+0.3*Math.sin(performance.now()/150);
    g.strokeStyle=col; g.lineWidth=1;
    g.beginPath(); g.ellipse(x,y+1,8,4,0,0,Math.PI*2); g.stroke(); g.restore();
  }
}

/* ---------------- HUD -------------------------------------------------- */
function drawHUD(){
  const pad=3;
  g.font='7px monospace'; g.textBaseline='top';
  g.fillStyle=PAL.hpBack; g.fillRect(pad,pad,44,5);
  g.fillStyle=PAL.hp; g.fillRect(pad,pad,Math.round(44*player.hp/player.hpMax),5);
  const ax=pad, ay=pad+7;
  const shk = shakeAether>0 ? Math.round(Math.sin(performance.now()/25)*2) : 0;
  g.fillStyle=PAL.aetherBack; g.fillRect(ax+shk,ay,44,4);
  const full = player.aether>=player.aetherMax-0.5;
  g.fillStyle = full?PAL.aetherHi:PAL.aether;
  g.fillRect(ax+shk,ay,Math.round(44*player.aether/player.aetherMax),4);
  g.fillStyle=PAL.hud;
  g.fillText('\u25cd'+Math.floor(player.aether), ax+47+shk, ay-2);
  if(flowT>=4){
    let label='FLOW'; if(flowT>=35)label='ASCENDANT';
    else if(flowT>=20)label='FLOW III'; else if(flowT>=10)label='FLOW II';
    g.fillStyle=PAL.flow3; g.fillText(label, pad, ay+6);
  }
  const hh=Math.floor(gameT/60)%24, mm=Math.floor(gameT%60);
  const clock='D'+dayN+' '+('0'+hh).slice(-2)+':'+('0'+mm).slice(-2);
  g.fillStyle=PAL.hudDim;
  g.fillText(clock, LW-g.measureText(clock).width-pad, pad);
  g.fillStyle=PAL.coin;
  const cs='\u25c9'+player.coins;
  g.fillText(cs, LW-g.measureText(cs).width-pad, pad+8);
  if(renown>0){
    g.fillStyle=PAL.hudDim;
    const rs='\u2691'+renown;
    g.fillText(rs, LW-g.measureText(rs).width-pad, pad+16);
  }
  {
    let s2, col;
    if(region.interior){
      s2 = region.name.toUpperCase();
      col = PAL.hud;
    } else if(region.depth===0){
      s2 = inTown(player.x,player.y)?'HAVENBROOK \u2014 SAFE':'HAVENBROOK VALE';
      col = inTown(player.x,player.y)?PAL.hud:PAL.hudDim;
    } else {
      s2 = region.name.toUpperCase()+'  \u25c6'+region.depth
         + (region.settlement&&inTown(player.x,player.y)?'  \u2014 SAFE':'');
      col = BRANCHES[region.branch].tint;
    }
    g.fillStyle=col;
    g.fillText(s2,(LW-g.measureText(s2).width)/2, pad);
  }
  if(banner){
    const a = banner.t<0.35?banner.t/0.35 : (banner.t>3.4?Math.max(0,(4.2-banner.t)/0.8):1);
    g.save(); g.globalAlpha=a;
    const w1=g.measureText(banner.name).width, w2=g.measureText(banner.sub).width;
    const bw=Math.max(w1,w2)+18, bx=(LW-bw)/2, by=Math.round(LH/2)-18;
    g.fillStyle='rgba(0,0,0,0.62)'; g.fillRect(bx,by,bw,24);
    g.fillStyle=region.depth===0?PAL.hud:BRANCHES[region.branch].tint;
    g.fillRect(bx,by,bw,1); g.fillRect(bx,by+23,bw,1);
    g.fillText(banner.name,(LW-w1)/2,by+4);
    g.fillStyle=PAL.hudDim;
    g.fillText(banner.sub,(LW-w2)/2,by+14);
    g.restore();
  }
  if(activeHint){
    const a = activeHint.leaving!==undefined?Math.max(0,activeHint.leaving*2):1;
    const txt = activeHint.h.text;
    g.save(); g.globalAlpha=a*0.85;
    const w = Math.min(LW-4, g.measureText(txt).width+10);
    const bx=(LW-w)/2, by=12;
    g.fillStyle='#000'; g.fillRect(bx,by,w,10);
    g.globalAlpha=a; g.fillStyle=PAL.hud;
    const pulse = activeHint.t>B.HINT_ESCALATE_S && Math.floor(performance.now()/400)%2;
    if(pulse)g.fillStyle='#ffe9a0';
    g.fillText(txt, bx+5, by+2);
    g.restore();
  }
}

function drawTouch(){
  if(stick.active){
    g.save(); g.globalAlpha=0.25;
    g.strokeStyle='#fff'; g.lineWidth=1;
    g.beginPath(); g.arc(stick.ox,stick.oy,22,0,Math.PI*2); g.stroke();
    g.globalAlpha=0.4; g.fillStyle='#fff';
    g.beginPath(); g.arc(stick.ox+stick.dx,stick.oy+stick.dy,8,0,Math.PI*2); g.fill();
    g.restore();
  }
  for(const k in buttons){
    const b=buttons[k];
    let on=true, ring=0;
    if(k==='A'){ on = player.aether>=B.NOVA.cost && !inTown(player.x,player.y);
      ring = Math.min(1, player.aether/B.NOVA.cost); }
    if(k==='C'){ on = player.aether>=B.DODGE_COST; }
    if(k==='D'){ on = false; }
    g.save();
    g.globalAlpha = on?0.55:0.22;
    g.fillStyle = '#101418';
    g.beginPath(); g.arc(b.x,b.y,b.r,0,Math.PI*2); g.fill();
    g.strokeStyle = on?PAL.aether:'#555';
    g.lineWidth=1.5;
    if(k==='A'&&on&&Math.floor(performance.now()/350)%2)
      g.strokeStyle=PAL.aetherHi;
    g.beginPath(); g.arc(b.x,b.y,b.r,0,Math.PI*2); g.stroke();
    if(k==='A'&&ring>0&&ring<1){
      g.strokeStyle=PAL.aether; g.globalAlpha=0.5;
      g.beginPath(); g.arc(b.x,b.y,b.r+3,-Math.PI/2,-Math.PI/2+ring*Math.PI*2); g.stroke();
    }
    g.globalAlpha = on?0.9:0.35;
    g.fillStyle=PAL.hud; g.font='8px monospace';
    const lw=g.measureText(b.label).width;
    g.fillText(b.label, b.x-lw/2, b.y-4);
    g.restore();
  }
}

/* ---------------- fixed 60 Hz loop -------------------------------------- */
let last=performance.now(), acc=0;
function frame(now){
  let ft = now-last; last=now;
  if(ft>100)ft=100;
  acc+=ft;
  const STEP=1000/60;
  while(acc>=STEP){ update(STEP/1000); acc-=STEP; }
  render(ft/1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
